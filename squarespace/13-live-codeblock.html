<script>
(function () {
  const CONFIG = {
    streamer: 'Trutz Stahl',
    channel: 'einfach_trutz',
    chat: true, // Twitch-Chat neben dem Stream-Fenster
    // Wochenplan (deutsche Zeit). Tag: 1 = Montag … 7 = Sonntag. Ende nach Mitternacht geht, z.B. '01:00'.
    // Beispiel: { day: 3, start: '19:00', end: '00:00', title: 'WoW Forever mit dem Chat' }
    schedule: []
  };
  const DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  const TZ = 'Europe/Berlin';

  const root = document.getElementById('tsz-plan');
  if (!root) return;
  const $ = (sel) => root.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const twitch = `https://www.twitch.tv/${encodeURIComponent(CONFIG.channel)}`;
  const host = location.hostname || 'trutzstaehler.de';

  // Uhrzeit in Berlin → echter Zeitpunkt (berücksichtigt Sommer- und Winterzeit)
  const berlinParts = (d) => Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false })
    .formatToParts(d).map(p => [p.type, p.value]));
  const WD = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
  function berlinTime(y, m, d, hh, mm) {
    // Startwert: als wäre Berlin UTC, dann um den Unterschied korrigieren (zweimal – wegen der Zeitumstellung)
    let t = Date.UTC(y, m - 1, d, hh, mm);
    for (let i = 0; i < 2; i++) {
      const p = berlinParts(new Date(t));
      const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute);
      t -= shown - Date.UTC(y, m - 1, d, hh, mm);
    }
    return t;
  }
  const hm = (s) => String(s || '0:0').split(':').map(Number);

  /** Alle Termine der nächsten 8 Tage als echte Zeitpunkte */
  function upcoming(now) {
    const p = berlinParts(new Date(now));
    const todayWd = WD[p.weekday];
    const out = [];
    for (let k = -1; k <= 7; k++) {
      const base = new Date(Date.UTC(+p.year, +p.month - 1, +p.day + k));
      const wd = ((todayWd - 1 + k) % 7 + 7) % 7 + 1;
      CONFIG.schedule.filter(s => Number(s.day) === wd).forEach(s => {
        const [h1, m1] = hm(s.start); const [h2, m2] = hm(s.end);
        const start = berlinTime(base.getUTCFullYear(), base.getUTCMonth() + 1, base.getUTCDate(), h1, m1);
        let end = berlinTime(base.getUTCFullYear(), base.getUTCMonth() + 1, base.getUTCDate(), h2, m2);
        if (end <= start) end += 86400000; // bis nach Mitternacht
        out.push({ s, start, end });
      });
    }
    return out.sort((a, b) => a.start - b.start);
  }

  const fmtLocal = (t) => new Date(t).toLocaleString('de-DE', { weekday: 'long', hour: '2-digit', minute: '2-digit' });
  function countdown(ms) {
    const m = Math.max(0, Math.round(ms / 60000));
    const d = Math.floor(m / 1440); const h = Math.floor((m % 1440) / 60); const mm = m % 60;
    return d ? `in ${d} ${d === 1 ? 'Tag' : 'Tagen'}, ${h} Std.` : h ? `in ${h} Std. ${mm} Min.` : `in ${mm} Min.`;
  }

  function renderNext() {
    const now = Date.now();
    const list = upcoming(now);
    const live = list.find(x => x.start <= now && now < x.end);
    const next = list.find(x => x.start > now);
    $('.tl-next').innerHTML = live ? `<b>Jetzt laut Plan live</b><span>bis ${new Date(live.end).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr · <a href="${twitch}" target="_blank" rel="noopener">zum Stream</a></span>`
      : next ? `<b>${esc(countdown(next.start - now))}</b><span>Nächster Stream: ${esc(fmtLocal(next.start))} Uhr</span>`
        : `<b>Plan folgt</b><span><a href="${twitch}/schedule" target="_blank" rel="noopener">Stream-Plan bei Twitch</a></span>`;
    return { list, live };
  }

  function renderWeek({ list, live }) {
    if (!CONFIG.schedule.length) {
      $('.tl-week').innerHTML = `<div class="tl-empty" style="grid-column:1/-1">Der Wochenplan steht gerade bei Twitch: <a href="${twitch}/schedule" target="_blank" rel="noopener">twitch.tv/${esc(CONFIG.channel)}/schedule</a> – folgen lohnt sich, dann meldet Twitch jeden Stream.</div>`;
      return;
    }
    const todayWd = WD[berlinParts(new Date()).weekday];
    $('.tl-week').innerHTML = DAYS.map((name, i) => {
      const wd = i + 1;
      const slots = CONFIG.schedule.filter(s => Number(s.day) === wd).sort((a, b) => String(a.start).localeCompare(String(b.start)));
      return `<div class="tl-day${wd === todayWd ? ' today' : ''}"><div class="tl-day-h">${name}${wd === todayWd ? ' · heute' : ''}</div>
        ${slots.length ? slots.map(s => `<div class="tl-slot${live && live.s === s ? ' now' : ''}"><b>${esc(s.start)}–${esc(s.end)} Uhr</b><span>${esc(s.title || 'WoW Forever')}</span></div>`).join('') : '<div class="tl-free">kein Stream</div>'}</div>`;
    }).join('');
  }

  $('.tl-lead').innerHTML = `${esc(CONFIG.streamer)} spielt World of Warcraft Forever – mit Helden, Bosskämpfen und Spielen für den Chat. Folgen auf <a href="${twitch}" target="_blank" rel="noopener">Twitch</a>, dann verpasst du keinen Stream.`;
  $('.tl-player').innerHTML = `<iframe data-ts-consent-src="https://player.twitch.tv/?channel=${encodeURIComponent(CONFIG.channel)}&parent=${encodeURIComponent(host)}&muted=true&autoplay=false" allowfullscreen title="Stream von ${esc(CONFIG.streamer)}"></iframe>`;
  if (CONFIG.chat) $('.tl-chat').innerHTML = `<iframe data-ts-consent-src="https://www.twitch.tv/embed/${encodeURIComponent(CONFIG.channel)}/chat?parent=${encodeURIComponent(host)}&darkpopout" title="Twitch-Chat"></iframe>`;
  else $('.tl-chat').remove();
  $('.tl-foot').textContent = 'Alle Zeiten in deutscher Zeit – der Countdown rechnet in deine Uhrzeit um.';

  function tick() { renderWeek(renderNext()); }
  tick();
  setInterval(renderNext, 30000);
})();
</script>

<style>
  .tsw-consent-host { position: relative; }
  .tsw-consent { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; color: #f3eee2; font-family: 'Asul', Georgia, serif;
    background: radial-gradient(ellipse at 50% 40%, rgba(255, 209, 0, .10), transparent 60%), linear-gradient(180deg, #17110c, #0b0806); }
  .tsw-consent svg { width: 34px; height: 34px; fill: #ffd100; filter: drop-shadow(0 0 18px rgba(255, 209, 0, .35)); }
  .tsw .tsw-consent__title { font-family: 'Cinzel', Georgia, serif; font-size: clamp(1rem, 1.6vw, 1.3rem); letter-spacing: .06em; color: #ffd100; margin: 0; }
  .tsw .tsw-consent__text { max-width: 44ch; font-size: .92rem; line-height: 1.55; color: #b8ad94; margin: 0; }
  .tsw .tsw-consent__text a { color: #ffd100; text-decoration: underline; text-underline-offset: 3px; }
  .tsw-consent__btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .tsw-consent button { font-family: 'Cinzel', Georgia, serif; font-size: .85rem; letter-spacing: .08em; padding: 11px 20px; border-radius: 999px; cursor: pointer; transition: transform .2s, background .2s, color .2s; }
  .tsw-consent button[data-ts-consent="once"] { background: #ffd100; color: #120e0b; border: 1px solid #ffd100; }
  .tsw-consent button[data-ts-consent="always"] { background: transparent; color: #f3eee2; border: 1px solid rgba(255, 209, 0, .45); }
  .tsw-consent button:hover { transform: translateY(-2px); }
  .tsw-consent button[data-ts-consent="always"]:hover { background: rgba(255, 209, 0, .12); }
  @media (max-width: 640px) {
    .tsw-consent { gap: 8px; padding: 12px; }
    .tsw-consent svg { display: none; }
    .tsw .tsw-consent__text { font-size: .78rem; line-height: 1.4; }
    .tsw-consent button { font-size: .75rem; padding: 8px 14px; }
  }
</style>
<script>
(function () {
  var KEY = 'ts-twitch-ok';
  var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 3 3 6.4v13.4h4.6V22h2.6l2.2-2.2h3.6L21 15V3H4.3Zm15 11.2-2.8 2.8H12l-2.2 2.2V17H6V4.7h13.3v9.5ZM16.4 7.6v4.9h-1.7V7.6h1.7Zm-4.6 0v4.9h-1.7V7.6h1.7Z"/></svg>';
  function ok() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function load() {
    document.querySelectorAll('iframe[data-ts-consent-src]').forEach(function (f) {
      f.src = f.getAttribute('data-ts-consent-src');
      f.removeAttribute('data-ts-consent-src');
    });
    document.querySelectorAll('.tsw-consent').forEach(function (o) { o.remove(); });
  }
  function scan() {
    var frames = document.querySelectorAll('iframe[data-ts-consent-src]');
    if (!frames.length) return;
    if (ok()) return load();
    frames.forEach(function (f) {
      var host = f.parentNode;
      if (!host || host.querySelector('.tsw-consent')) return;
      var chat = /\/chat/.test(f.getAttribute('data-ts-consent-src'));
      host.classList.add('tsw-consent-host');
      var o = document.createElement('div');
      o.className = 'tsw-consent';
      o.innerHTML = ICON +
        '<p class="tsw-consent__title">' + (chat ? 'Twitch-Chat' : 'Stream auf Twitch') + '</p>' +
        '<p class="tsw-consent__text">Beim Laden überträgt Twitch Daten wie deine IP-Adresse und setzt Cookies. Mehr dazu in der <a href="/datenschutz">Datenschutzerklärung</a>.</p>' +
        '<div class="tsw-consent__btns"><button type="button" data-ts-consent="once">' + (chat ? 'Chat laden' : 'Stream laden') + '</button>' +
        '<button type="button" data-ts-consent="always">Immer laden</button></div>';
      host.appendChild(o);
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-ts-consent]');
    if (!b) return;
    e.preventDefault();
    if (b.getAttribute('data-ts-consent') === 'always') { try { localStorage.setItem(KEY, '1'); } catch (err) {} }
    load();
  });
  scan();
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
