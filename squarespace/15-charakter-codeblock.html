<!-- =====================================================================
     TRUTZ STÄHLER · TWITCH-BEREICH (WoW Forever) · CHARAKTER
     Einfügen in: Seite /charakter → einzige Sektion → Code-Block (volle Breite),
     „Quelltext anzeigen“ aus. Navigation, Unternavigation (mit Weg zurück zur
     Homepage) und Footer kommen aus dem globalen Header- und Footer-Code.
     Die Daten kommen wie bisher aus der Stream-Zentrale (CONFIG.dataUrl im Skript).

     ===================================================================== -->

  <section class="ts tsw-hero ts-container">
      <div class="tsw-hero__meta">

        <p class="tsw-label" style="margin:0">Helden aus dem Chat</p>
      </div>

      <div>

<style>
  #tsz-chars {
    --tc-gold: #ffd100;
    --tc-txt: #f3eee2;
    --tc-muted: #b8ad94;
    --tc-ts: 1px 1px 0 #000, 0 1px 3px rgba(0, 0, 0, 0.8);
    --tc-panel: linear-gradient(180deg, #161616 0%, #0c0c0c 100%);
    --tc-line: #4a4a4a;
    --tc-line-hi: #7a7a7a;
    max-width: 1100px;
    margin: 0 auto;
    padding: 22px;
    border-radius: 4px;
    background: #120e0b;   /* eigener dunkler Hintergrund – passt auf helle wie dunkle Seiten */
    color: var(--tc-txt);
    font: 400 16px/1.45 Asul, Georgia, serif;
    text-align: left;
  }
  #tsz-chars *, #tsz-chars *::before, #tsz-chars *::after { box-sizing: border-box; }
  #tsz-chars [hidden] { display: none !important; }
  #tsz-chars a { text-decoration: none; }
  #tsz-chars button { font: inherit; cursor: pointer; }

  /* ---------- Kopf mit Suche ---------- */
  #tsz-chars .tc-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
  #tsz-chars .tc-h { margin: 0 0 4px; font: 700 30px/1.2 Cinzel, Georgia, serif; letter-spacing: 0.5px; color: var(--tc-gold); text-shadow: var(--tc-ts); }
  #tsz-chars .tc-lead { margin: 0; color: var(--tc-muted); font-size: 16px; }
  #tsz-chars .tc-lead b { color: var(--tc-gold); }
  #tsz-chars .tc-search {
    width: 260px; max-width: 100%; padding: 9px 12px; border-radius: 4px;
    border: 1px solid #8c713c; background: #0d0b09; color: var(--tc-txt);
    font: 400 16px Asul, Georgia, serif; box-shadow: inset 0 0 6px #000; outline: none;
  }
  #tsz-chars .tc-search:focus { border-color: #c59b47; }

  /* ---------- Liste aller Charaktere ---------- */
  #tsz-chars .tc-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  #tsz-chars .tc-card {

  #tsz-chars .tc-card-band { align-self: stretch; width: 5px; border-radius: 2px; flex: 0 0 auto; background: #2f6fd1; }
  #tsz-chars .tc-card.horde .tc-card-band { background: #b0182a; }
  #tsz-chars .tc-card-txt { min-width: 0; }
  #tsz-chars .tc-card-pic { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; border: 2px solid #8c713c; box-shadow: 0 0 0 1px #000; }
  #tsz-chars .tc-card-name { display: block; font: 700 18px Asul, Georgia, serif; text-shadow: var(--tc-ts); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tsz-chars .tc-card-sub { display: block; font-size: 14px; color: var(--tc-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tsz-chars .tc-empty { grid-column: 1 / -1; padding: 18px; text-align: center; color: var(--tc-muted); }
  #tsz-chars .tc-foot { margin: 12px 0 0; font-size: 14px; color: var(--tc-muted); }

  /* =========================================================
     CHARAKTERFENSTER – aufgebaut wie im Spiel:

  #tsz-chars .tc-copy:hover { color: var(--tc-gold); }
  /* Rundes Porträt oben links (ragt über den Rahmen wie im Spiel) */
  #tsz-chars .tc-avatar {
    position: absolute; left: 0; top: 0; z-index: 2; width: 84px; height: 84px; border-radius: 50%; overflow: hidden;

  #tsz-chars .tc-avatar.horde { background: radial-gradient(circle at 50% 35%, #7f2a24 0%, #250807 80%); }

  /* Inhalt des Reiters „Charakter“ */
  #tsz-chars .tc-doll { display: grid; grid-template-columns: 50px 1fr 50px; gap: 10px; padding: 12px 10px 8px; }

  }
  #tsz-chars .tc-model img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* Gezeichnete Figur: Körper nach Volk & Geschlecht, angelegte Teile in ihrer Qualitätsfarbe */
  #tsz-chars .tc-fig { position: absolute; top: 4px; left: 44px; width: calc(100% - 88px); height: calc(100% - 26px); }
  #tsz-chars .tc-fig .tc-limb, #tsz-chars .tc-fig .tc-sb, #tsz-chars .tc-fig .tc-sc, #tsz-chars .tc-fig .tc-st, #tsz-chars .tc-fig .tc-chain, #tsz-chars .tc-fig .tc-wb, #tsz-chars .tc-fig .tc-wt, #tsz-chars .tc-fig .tc-string { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #tsz-chars .tc-fig .tc-gb { fill: var(--m, #3d3a36); stroke: #000; stroke-width: 2.6; stroke-linejoin: round; }
  #tsz-chars .tc-fig .tc-gt { fill: var(--q); fill-opacity: 0.16; stroke: var(--q); stroke-width: 1.5; stroke-linejoin: round; }
  #tsz-chars .tc-fig .tc-sb { stroke: #000; }
  #tsz-chars .tc-fig .tc-sc { stroke: var(--m, #3d3a36); }
  #tsz-chars .tc-fig .tc-st { stroke: var(--q); stroke-opacity: 0.2; }
  #tsz-chars .tc-fig .tc-chain { stroke: var(--q); stroke-width: 1.2; }
  #tsz-chars .tc-fig .tc-ring { fill: none; stroke: var(--q); stroke-width: 1.8; }
  #tsz-chars .tc-fig .tc-buckle { fill: #c9a64a; stroke: #000; stroke-width: 1; }
  #tsz-chars .tc-fig .tc-wb { stroke: #000; stroke-width: 6; }
  #tsz-chars .tc-fig .tc-wt { stroke: var(--q); stroke-width: 3; }
  #tsz-chars .tc-fig .tc-string { stroke: #bbb; stroke-width: 0.8; }
  #tsz-chars .tc-fig .tc-gp { cursor: pointer; transition: filter 0.15s; }
  #tsz-chars .tc-fig .tc-gp:hover, #tsz-chars .tc-fig .tc-gp.sel { filter: brightness(1.45) drop-shadow(0 0 3px var(--q)); }
  #tsz-chars .tc-fig .tc-gp.sel .tc-gt { fill-opacity: 0.45; stroke: #ffd100; stroke-width: 1.8; }
  #tsz-chars .tc-fig .tc-gp.sel .tc-st { stroke-opacity: 0.55; }
  #tsz-chars .tc-model-cap { position: absolute; left: 10px; bottom: 6px; font-size: 14px; color: var(--tc-muted); }
  #tsz-chars .tc-model-cap b { font: 700 15px Cinzel, Georgia, serif; text-shadow: var(--tc-ts); }
  /* Abzeichen-Spalte rechts im Bild (im Spiel: Widerstände) */
  #tsz-chars .tc-marks { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
  #tsz-chars .tc-mark {
    position: relative; width: 32px; height: 32px; border-radius: 3px; border: 1px solid #555; background: #0a0a0a;
    box-shadow: inset 0 0 6px #000; display: flex; align-items: center; justify-content: center; flex: 0 0 32px;
  }
  #tsz-chars .tc-mark svg { width: 20px; height: 20px; }
  #tsz-chars .tc-mark i { position: absolute; right: 2px; bottom: 0; font: 700 14px/1 Asul, Georgia, serif; font-style: normal; color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
  /* Zwei Kästen unter dem Bild */

  #tsz-chars .tc-kv dt { color: var(--tc-gold); font-weight: 700; }

  #tsz-chars .tc-weapons { display: flex; justify-content: center; gap: 8px; padding: 2px 0 12px; }

  /* Ausrüstungsplatz: nur das Symbol wie im Spiel, leer mit grauem Umriss */

  }

  #tsz-chars button.tc-slot:hover, #tsz-chars a.tc-slot:hover { filter: brightness(1.15); }
  #tsz-chars .q-poor { --q: #9d9d9d; } #tsz-chars .q-common { --q: #ffffff; } #tsz-chars .q-uncommon { --q: #1eff00; }
  #tsz-chars .q-rare { --q: #0070dd; } #tsz-chars .q-epic { --q: #a335ee; } #tsz-chars .q-legendary { --q: #ff8000; }
  #tsz-chars .tc-slot[class*="q-"] { border-color: var(--q); }

  #tsz-chars .tc-iteminfo { display: flex; align-items: center; gap: 10px; min-height: 42px; margin: 0 10px 12px; padding: 6px 10px; border: 1px solid #262626; border-radius: 3px; background: #0a0a0a; font-size: 15px; }
  #tsz-chars .tc-iteminfo b { color: var(--q, var(--tc-txt)); }
  #tsz-chars .tc-iteminfo small { color: var(--tc-muted); font-size: 14px; }
  #tsz-chars .tc-iteminfo a { margin-left: auto; color: var(--tc-gold); white-space: nowrap; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }

  /* Reiter unter dem Fenster */
  #tsz-chars .tc-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px; margin-top: -2px; }
  #tsz-chars .tc-tab {
    padding: 6px 14px 7px; border: 2px solid var(--tc-line); border-top: none; border-radius: 0 0 4px 4px;
    background: linear-gradient(180deg, #0f0f0f, #1d1d1d); color: var(--tc-muted); font-size: 15px; font-weight: 700; text-shadow: var(--tc-ts);
  }
  #tsz-chars .tc-tab:hover { color: var(--tc-txt); }
  #tsz-chars .tc-tab.on { color: var(--tc-txt); background: linear-gradient(180deg, #161616, #2a2a2a); border-color: var(--tc-line-hi); padding-top: 9px; }

  /* Reiter „Ruf“, „Beute“, „Abzeichen“ */
  #tsz-chars .tc-page { padding: 14px 16px 16px; min-height: 420px; }
  #tsz-chars .tc-page h3 { margin: 0 0 10px; font: 700 18px Asul, Georgia, serif; color: var(--tc-gold); text-shadow: var(--tc-ts); }
  #tsz-chars .tc-page p { margin: 0 0 12px; color: var(--tc-muted); font-size: 15px; }
  #tsz-chars .tc-rep { position: relative; height: 24px; border-radius: 3px; overflow: hidden; border: 1px solid #000; background: #070707; box-shadow: 0 0 0 1px #3a3a3a, inset 0 0 8px #000; }
  #tsz-chars .tc-rep-fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #34c234 0%, #1f8a1f 50%, #0f5a0f 100%); box-shadow: inset -2px 0 0 #d6ffd6; }

  #tsz-chars .tc-rep.rmax .tc-rep-fill { background: linear-gradient(180deg, #2fd6b4 0%, #12a184 50%, #076450 100%); box-shadow: none; }
  #tsz-chars .tc-rep span { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; font: 700 14px Asul, Georgia, serif; color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; font-variant-numeric: tabular-nums; }
  #tsz-chars .tc-ladder { margin: 14px 0 0; padding: 0; list-style: none; border: 1px solid #262626; border-radius: 3px; }

  #tsz-chars .tc-ladder li.done { color: var(--tc-txt); }
  #tsz-chars .tc-ladder li.cur { color: var(--tc-gold); font-weight: 700; background: rgba(255, 209, 0, 0.06); }
  #tsz-chars .tc-loot { margin: 0; padding: 0; list-style: none; }
  #tsz-chars .tc-loot li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1d1d1d; }

  #tsz-chars .tc-loot b { color: var(--q, var(--tc-txt)); }

  #tsz-chars .tc-badgelist { display: grid; gap: 8px; }
  #tsz-chars .tc-badgerow { display: flex; align-items: center; gap: 10px; }
  #tsz-chars .tc-nothing { padding: 30px 10px; text-align: center; color: var(--tc-muted); }
  /* Titel hinter dem Namen, Erfahrungsbalken (lila wie im Spiel) */
  #tsz-chars .tc-ttl { font-weight: 400; }
  #tsz-chars .tc-xp { position: relative; height: 18px; margin: 2px 8px 8px; border-radius: 3px; overflow: hidden; border: 1px solid #000; background: #0d0710; box-shadow: 0 0 0 1px #3a3a3a, inset 0 0 6px #000; }

  // Grundfarbe nach Material, die Qualität zeigt der leuchtende Rand
  const MATERIAL = { plate: '#6b717a', mail: '#4f5660', leather: '#5e4430', cloth: '#41384f', shield: '#5b6068', holdable: '#3c3f52' };
  const WEAPON_KIND = { sword1: 'sword1', sword2: 'sword2', dagger: 'dagger', axe1: 'axe1', axe2: 'axe2', mace1: 'mace1', mace2: 'mace2', staff: 'staff', polearm: 'polearm', fist: 'fist', wand: 'wand', shield: 'shield', holdable: 'holdable' };

  /** Die Figur als SVG: Körper nach Volk & Geschlecht, darüber jedes angelegte Teil in seiner Qualitätsfarbe */
  function dollSvg(c) {
    const B = BODY[c.race] || BODY.mensch;
    const w = c.gender === 'w';
    const G = 288, cx = 100;
    const H = B.H * (w ? 0.96 : 1), sw = B.sw * (w ? 0.86 : 1), ww = B.ww * (w ? 0.8 : 1), hw = B.hw * (w ? 1.08 : 1);
    const r = B.head * (w ? 0.95 : 1), limb = B.limb * (w ? 0.88 : 1), sc = H / 250;
    const top = G - H, hy = top + r * 1.05, neckY = hy + r * 0.9, shY = neckY + r * 0.35;
    const crotchY = G - H * B.leg, waistY = shY + (crotchY - shY) * 0.6, kneeY = crotchY + (G - crotchY) * 0.48, ankleY = G - 7;
    const side = (sgn) => {
      const S = [cx + sgn * (sw - limb * 0.45), shY + limb * 0.45];
      const E = [cx + sgn * (sw + limb * 0.3), waistY - 2];
      const Hd = [cx + sgn * (sw + limb * 0.65), crotchY + limb * 0.3];
      const P = [cx + sgn * hw * 0.5, crotchY - limb * 0.5], K = [cx + sgn * hw * 0.56, kneeY], A = [cx + sgn * hw * 0.56, ankleY];
      return { S, E, Hd, P, K, A };
    };
    const L = side(-1), R = side(1); // L = rechte Hand des Helden (Waffenhand, im Bild links)
    const gear = c.gear || {};
    const has = (k) => gear[k] && gear[k].id;
    const q = (k) => (has(k) ? qOf(gear[k]) : '');
    const kindOf = (k) => (has(k) ? String(gear[k].kind || '') : '');

    // Formen
    const torso = (y0, y1, inset) => {
      const t = (y) => (y <= waistY ? sw + (ww - sw) * (y - shY) / (waistY - shY) : ww + (hw - ww) * (y - waistY) / (crotchY - waistY));
      const a = Math.max(shY, y0), b = Math.min(crotchY, y1), wa = t(a) + inset, wb = t(b) + inset;
      const mid = a < waistY && b > waistY ? `L${pt(cx + ww + inset, waistY)}` : '';
      const midL = mid ? `L${pt(cx - ww - inset, waistY)}` : '';
      return `M${pt(cx - wa + 5, a - 2)}L${pt(cx + wa - 5, a - 2)}Q${pt(cx + wa, a - 1)} ${pt(cx + wa, a + 4)}${mid}L${pt(cx + wb, b)}L${pt(cx - wb, b)}${midL}L${pt(cx - wa, a + 4)}Q${pt(cx - wa, a - 1)} ${pt(cx - wa + 5, a - 2)}Z`;
    };
    const line = (pts) => 'M' + pts.map(p => pt(p[0], p[1])).join('L');
    const limbPath = (sd, from, to) => line([sd.S, sd.E, sd.Hd].slice(from, to));
    const piece = (k, inner) => `<g class="tc-gp q-${q(k)}${ui.slot === k ? ' sel' : ''}" data-pick="${k}" style="--m:${MATERIAL[kindOf(k)] || (['mainhand', 'offhand', 'ranged'].includes(k) ? '#70757d' : '#3d3a36')}">${inner}</g>`;
    const fillP = (d) => `<path class="tc-gb" d="${d}"/><path class="tc-gt" d="${d}"/>`;
    const strokeP = (d, wd) => `<path class="tc-sb" d="${d}" stroke-width="${f1(wd + 2.5)}"/><path class="tc-sc" d="${d}" stroke-width="${f1(wd)}"/><path class="tc-st" d="${d}" stroke-width="${f1(wd)}"/>`;
    const out = [];

    // Hinten: Umhang und Distanzwaffe auf dem Rücken
    if (has('back')) {
      const y = kneeY + (G - kneeY) * 0.35;
      out.push(piece('back', fillP(`M${pt(cx - sw * 0.8, shY)}L${pt(cx + sw * 0.8, shY)}L${pt(cx + sw * 1.1, y)}Q${pt(cx + sw * 0.5, y + 6)} ${pt(cx, y)}Q${pt(cx - sw * 0.5, y + 6)} ${pt(cx - sw * 1.1, y)}Z`)));
    }
    if (has('ranged')) {
      const k = kindOf('ranged');
      if (k === 'bow') out.push(piece('ranged', `<path class="tc-wb" d="M${pt(cx + sw * 1.15, top + r)}Q${pt(cx - sw * 0.6, shY + 10)} ${pt(cx - sw * 1.2, crotchY)}"/><path class="tc-wt" d="M${pt(cx + sw * 1.15, top + r)}Q${pt(cx - sw * 0.6, shY + 10)} ${pt(cx - sw * 1.2, crotchY)}"/><path class="tc-string" d="M${pt(cx + sw * 1.15, top + r)}L${pt(cx - sw * 1.2, crotchY)}"/>`));
      else if (k === 'gun' || k === 'crossbow') out.push(piece('ranged', fillP(`M${pt(cx + sw * 1.1, top + r * 0.6)}l5 4l${f1(-sw * 2.2)} ${f1(crotchY - top - r)}l-9 -2z`) + (k === 'crossbow' ? `<path class="tc-string" d="M${pt(cx + sw * 0.1, shY - 6)}l18 14"/>` : '')));
    }

    // Haare hinten (lang bei Heldinnen, Nachtelfen & Himmelsgeborenen)
    if (w || c.race === 'nachtelf' || c.race === 'himmelsgeborene' || c.race === 'himmelsgebotene') {
      const len = w ? shY + (waistY - shY) * 0.55 : shY + 6;
      out.push(`<path fill="${B.hair}" stroke="#000" stroke-width="1.2" d="M${pt(cx - r * 1.05, hy)}Q${pt(cx - r * 1.3, len - 8)} ${pt(cx - r * 1.2, len)}L${pt(cx + r * 1.2, len)}Q${pt(cx + r * 1.3, len - 8)} ${pt(cx + r * 1.05, hy)}Z"/>`);
    }

    // Körper: Beine, Rumpf, Arme, Kopf (Haut & schlichtes Leinen)
    for (const sd of [L, R]) {
      out.push(`<path class="tc-limb" d="${line([sd.P, sd.K, sd.A])}" stroke-width="${f1(limb * 1.2 + 2.5)}" stroke="#000"/><path class="tc-limb" d="${line([sd.P, sd.K, sd.A])}" stroke-width="${f1(limb * 1.2)}" stroke="#2a2724"/>`);
      out.push(`<ellipse cx="${f1(sd.A[0] + (sd === L ? -3 : 3))}" cy="${G - 3}" rx="${f1(limb * 0.85)}" ry="4.5" fill="#1f1c1a" stroke="#000" stroke-width="1.2"/>`);
    }
    out.push(`<path d="${torso(shY, crotchY, 0)}" fill="#2f2b27" stroke="#000" stroke-width="1.4"/>`);
    out.push(`<rect x="${f1(cx - r * 0.42)}" y="${f1(hy + r * 0.5)}" width="${f1(r * 0.84)}" height="${f1(shY - hy - r * 0.3)}" fill="${B.skin}" stroke="#000" stroke-width="1.2"/>`);
    for (const sd of [L, R]) {
      out.push(`<path class="tc-limb" d="${limbPath(sd, 0, 3)}" stroke-width="${f1(limb + 2.5)}" stroke="#000"/><path class="tc-limb" d="${limbPath(sd, 0, 3)}" stroke-width="${f1(limb)}" stroke="${B.skin}"/>`);
      out.push(`<circle cx="${f1(sd.Hd[0])}" cy="${f1(sd.Hd[1])}" r="${f1(limb * 0.62)}" fill="${B.skin}" stroke="#000" stroke-width="1.2"/>`);
    }
    // Ohren, Hörner, Hauer – je Volk
    const ear = (tx, ty, bw) => [-1, 1].map(s => `<path fill="${B.skin}" stroke="#000" stroke-width="1.2" d="M${pt(cx + s * r * 0.8, hy - r * 0.15)}L${pt(cx + s * r * tx, hy - r * ty)}L${pt(cx + s * r * 0.85, hy + r * bw)}Z"/>`).join('');
    if (c.race === 'nachtelf') out.push(ear(2.7, 1.1, 0.35));
    else if (c.race === 'troll') out.push(ear(2.3, 0.35, 0.3));
    else if (c.race === 'gnom') out.push(ear(1.75, 0.45, 0.35));
    else if (c.race === 'orc' || c.race.startsWith('himmels')) out.push(ear(1.45, 0.3, 0.25));
    else if (c.race === 'tauren') out.push(ear(1.6, -0.05, 0.25));
    out.push(`<ellipse cx="${cx}" cy="${f1(hy)}" rx="${f1(r * 0.92)}" ry="${f1(r)}" fill="${B.skin}" stroke="#000" stroke-width="1.4"/>`);
    const eye = c.race === 'nachtelf' ? '#d9ecff' : c.race === 'untote' ? '#ffd27a' : '#141414';
    out.push([-1, 1].map(s => `<ellipse cx="${f1(cx + s * r * 0.36)}" cy="${f1(hy + r * 0.02)}" rx="${f1(r * 0.13)}" ry="${f1(r * 0.08)}" fill="${eye}"/>`).join(''));
    if (c.race === 'tauren') out.push(`<ellipse cx="${cx}" cy="${f1(hy + r * 0.55)}" rx="${f1(r * 0.6)}" ry="${f1(r * 0.42)}" fill="${B.skin}" stroke="#000" stroke-width="1.2"/>`);
    if (c.race === 'orc' || c.race === 'troll') {
      const t = c.race === 'troll' ? 1.6 : 1;
      out.push([-1, 1].map(s => `<path fill="#e3dac2" stroke="#000" stroke-width="1" d="M${pt(cx + s * r * 0.35, hy + r * 0.6)}q${f1(s * r * 0.25 * t)} ${f1(-r * 0.2)} ${f1(s * r * 0.15 * t)} ${f1(-r * 0.7 * t)}q${f1(-s * r * 0.05)} ${f1(r * 0.45 * t)} ${f1(-s * r * 0.3 * t)} ${f1(r * 0.75 * t)}z"/>`).join(''));
    }
    // Haare oben (wenn kein Helm)
    if (!has('head')) {
      if (c.race === 'troll' && !w) out.push(`<path fill="${B.hair}" stroke="#000" stroke-width="1.2" d="M${pt(cx - r * 0.25, hy - r * 0.7)}L${pt(cx - r * 0.1, hy - r * 2.1)}L${pt(cx + r * 0.25, hy - r * 0.75)}Z"/>`);
      else if (c.race !== 'tauren' && c.race !== 'untote') out.push(`<path fill="${B.hair}" stroke="#000" stroke-width="1.2" d="M${pt(cx - r * 0.93, hy - r * 0.05)}Q${pt(cx - r, hy - r * 1.25)} ${pt(cx, hy - r * 1.08)}Q${pt(cx + r, hy - r * 1.25)} ${pt(cx + r * 0.93, hy - r * 0.05)}Q${pt(cx, hy - r * 0.75)} ${pt(cx - r * 0.93, hy - r * 0.05)}Z"/>`);
    }

    // Ausrüstung von innen nach außen
    if (has('shirt')) out.push(piece('shirt', fillP(torso(shY, waistY + (crotchY - waistY) * 0.5, 0.5)) + [L, R].map(sd => strokeP(limbPath(sd, 0, 2), limb + 1)).join('')));
    if (has('legs')) out.push(piece('legs', fillP(`M${pt(cx - hw - 0.5, crotchY - 8)}L${pt(cx + hw + 0.5, crotchY - 8)}L${pt(cx + hw * 0.9, crotchY + 6)}L${pt(cx - hw * 0.9, crotchY + 6)}Z`) + [L, R].map(sd => strokeP(line([sd.P, sd.K, lerp(sd.K, sd.A, 0.85)]), limb * 1.2 + 1)).join('')));
    if (has('feet')) out.push(piece('feet', [L, R].map(sd => strokeP(line([lerp(sd.K, sd.A, 0.45), sd.A]), limb * 1.3 + 1) + fillP(`M${pt(sd.A[0] - limb * 0.95 + (sd === L ? -3 : 3), G - 1)}a${f1(limb * 0.95)} 6.5 0 0 1 ${f1(limb * 1.9)} 0z`)).join('')));
    if (has('chest')) {
      const robe = /robe/i.test(String(gear.chest.inv || ''));
      let d = torso(shY, robe ? crotchY : waistY + (crotchY - waistY) * 0.55, 1);
      if (robe) d += `M${pt(cx - hw - 1, crotchY - 1)}L${pt(cx + hw + 1, crotchY - 1)}L${pt(cx + hw * 1.45, kneeY + (G - kneeY) * 0.45)}L${pt(cx - hw * 1.45, kneeY + (G - kneeY) * 0.45)}Z`;
      out.push(piece('chest', fillP(d) + [L, R].map(sd => strokeP(line([sd.S, lerp(sd.S, sd.E, 0.45)]), limb + 1.5)).join('')));
    }
    if (has('tabard')) {
      const tw = sw * 0.42, y = crotchY + (kneeY - crotchY) * 0.65;
      out.push(piece('tabard', fillP(`M${pt(cx - tw, shY + 1)}L${pt(cx + tw, shY + 1)}L${pt(cx + tw, y)}L${pt(cx, y + 7)}L${pt(cx - tw, y)}Z`)));
    }
    if (has('waist')) {
      const bh = Math.max(5, H * 0.028), bw = ww + 1.5;
      out.push(piece('waist', fillP(`M${pt(cx - bw, waistY - bh / 2)}L${pt(cx + bw, waistY - bh / 2)}L${pt(cx + bw + 0.5, waistY + bh / 2)}L${pt(cx - bw - 0.5, waistY + bh / 2)}Z`) + `<rect class="tc-buckle" x="${f1(cx - bh * 0.6)}" y="${f1(waistY - bh * 0.6)}" width="${f1(bh * 1.2)}" height="${f1(bh * 1.2)}"/>`));
    }
    if (has('wrist')) out.push(piece('wrist', [L, R].map(sd => strokeP(line([lerp(sd.E, sd.Hd, 0.4), lerp(sd.E, sd.Hd, 0.8)]), limb + 2)).join('')));
    if (has('hands')) out.push(piece('hands', [L, R].map(sd => fillP(`M${pt(sd.Hd[0] - limb * 0.75, sd.Hd[1])}a${f1(limb * 0.75)} ${f1(limb * 0.75)} 0 1 0 ${f1(limb * 1.5)} 0a${f1(limb * 0.75)} ${f1(limb * 0.75)} 0 1 0 ${f1(-limb * 1.5)} 0z`)).join('')));
    if (has('shoulder')) out.push(piece('shoulder', [L, R].map((sd, i) => {
      const x = sd.S[0] + (i ? 2 : -2), y = shY + limb * 0.55, rx = limb * 1.1, ry = limb * 0.95;
      return fillP(`M${pt(x - rx, y)}A${f1(rx)} ${f1(ry)} 0 0 1 ${pt(x + rx, y)}L${pt(x + rx * 0.8, y + ry * 0.45)}L${pt(x - rx * 0.8, y + ry * 0.45)}Z`);
    }).join('')));
    if (c.race === 'zwerg' && !w) out.push(`<path fill="${B.hair}" stroke="#000" stroke-width="1.2" d="M${pt(cx - r * 0.9, hy + r * 0.15)}Q${pt(cx - r * 0.9, shY + (waistY - shY) * 0.45)} ${pt(cx, shY + (waistY - shY) * 0.62)}Q${pt(cx + r * 0.9, shY + (waistY - shY) * 0.45)} ${pt(cx + r * 0.9, hy + r * 0.15)}Q${pt(cx, hy + r * 0.45)} ${pt(cx - r * 0.9, hy + r * 0.15)}Z"/>`);
    if (has('neck')) out.push(piece('neck', `<path class="tc-chain" d="M${pt(cx - r * 0.55, shY - 1)}L${pt(cx, shY + H * 0.045)}L${pt(cx + r * 0.55, shY - 1)}"/>` + fillP(`M${pt(cx, shY + H * 0.045 - 1)}l4 5l-4 5l-4 -5z`)));
    if (has('head')) {
      out.push(piece('head', fillP(`M${pt(cx - r * 1.04, hy + r * 0.1)}A${f1(r * 1.04)} ${f1(r * 1.12)} 0 0 1 ${pt(cx + r * 1.04, hy + r * 0.1)}L${pt(cx + r * 1.0, hy + r * 0.72)}L${pt(cx + r * 0.58, hy + r * 0.72)}L${pt(cx + r * 0.5, hy + r * 0.12)}L${pt(cx + r * 0.12, hy + r * 0.12)}L${pt(cx + r * 0.08, hy + r * 0.55)}L${pt(cx - r * 0.08, hy + r * 0.55)}L${pt(cx - r * 0.12, hy + r * 0.12)}L${pt(cx - r * 0.5, hy + r * 0.12)}L${pt(cx - r * 0.58, hy + r * 0.72)}L${pt(cx - r * 1.0, hy + r * 0.72)}Z`)));
    }
    if (c.race === 'tauren') out.push([-1, 1].map(s => `<path fill="#d9cfb4" stroke="#000" stroke-width="1.2" d="M${pt(cx + s * r * 0.55, hy - r * 0.6)}Q${pt(cx + s * r * 1.9, hy - r * 0.55)} ${pt(cx + s * r * 2.1, hy - r * 1.7)}Q${pt(cx + s * r * 1.5, hy - r * 0.95)} ${pt(cx + s * r * 0.75, hy - r * 0.95)}Z"/>`).join(''));
    // Ringe & Schmuck
    [['finger1', L], ['finger2', R]].forEach(([k, sd]) => {
      if (has(k)) out.push(piece(k, `<circle class="tc-ring" cx="${f1(sd.Hd[0])}" cy="${f1(sd.Hd[1] + limb * 0.35)}" r="2.6"/>`));
    });
    [['trinket1', -1], ['trinket2', 1]].forEach(([k, s]) => {
      if (has(k)) out.push(piece(k, fillP(`M${pt(cx + s * ww * 0.62, waistY + 4)}l4 5l-4 5l-4 -5z`)));
    });
    // Waffen in den Händen (Waffenhand im Bild links, Schildhand rechts)
    const hold = (k, sd, sgn) => {
      if (!has(k)) return;
      const kind = WEAPON_KIND[kindOf(k)] || (k === 'offhand' ? 'shield' : 'sword1');
      const ang = kind === 'shield' || kind === 'holdable' ? 0 : kind === 'staff' || kind === 'polearm' ? sgn * -6 : sgn * -28;
      const dx = kind === 'shield' ? sgn * limb * 0.9 : 0;
      out.push(piece(k, `<g transform="translate(${f1(sd.Hd[0] + dx)} ${f1(sd.Hd[1])}) rotate(${ang})">${fillP(weaponPath(kind, sc))}</g>`));
    };
    hold('mainhand', L, 1);
    hold('offhand', R, -1);
    if (has('ranged') && !['bow', 'gun', 'crossbow'].includes(kindOf('ranged'))) {
      // Zauberstab, Wurfwaffe, Buchband & Götze hängen am Gürtel
      out.push(piece('ranged', `<g transform="translate(${f1(cx + ww + 3)} ${f1(waistY + 16)}) rotate(160)">${fillP(weaponPath('wand', sc))}</g>`));
    }

    const worn = ALL_SLOTS.filter(s => has(s[0])).length;
    return `<svg class="tc-fig" viewBox="0 10 200 284" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(raceName(c))} mit ${worn} angelegten ${worn === 1 ? 'Gegenstand' : 'Gegenständen'}">${out.join('')}</svg>`;
  }

  function modelHtml(c) {
    const key = `${c.race}-${c.gender}`;
    const img = CONFIG.images[key] || CONFIG.images[c.race];
    const marks = (c.badges || []).filter(b => MARKS[b.t]).map(b => {
      const m = MARKS[b.t];
      return `<span class="tc-mark" title="${m.name}${b.months ? ` · ${num(b.months)} ${Number(b.months) === 1 ? 'Monat' : 'Monate'}` : ''}">${svg(m.svg, m.color)}${b.months ? `<i>${num(b.months)}</i>` : ''}</span>`;
    }).join('');
    return `<div class="tc-model">
      ${img ? `<img src="${esc(img)}" alt="${esc(raceName(c))}">`
        : `${dollSvg(c)}<span class="tc-model-cap"><b style="color:${cls(c).color}">${esc(raceName(c))}</b>${c.gender === 'w' ? ' · weiblich' : c.gender === 'm' ? ' · männlich' : ''}</span>`}
      ${marks ? `<div class="tc-marks">${marks}</div>` : ''}
    </div>`;
  }

  const kv = (rows) => `<dl class="tc-kv">${rows.filter(r => r[1] != null && r[1] !== '').map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;

  function gearStats(c) {
    const items = ALL_SLOTS.map(s => c.gear && c.gear[s[0]]).filter(it => it && it.id);
    const lv = items.filter(it => it.ilvl);
    return { worn: items.length, ilvl: lv.length ? Math.round(lv.reduce((a, it) => a + Number(it.ilvl), 0) / lv.length) : null };
  }

  function repParts(c) {
    const r = c.rep || { rank: 'Neutral', idx: 0, pts: 0 };
    const ladder = data.ladder || LADDER;
    const cur = ladder[r.idx] || ladder[0];
    const next = ladder[r.idx + 1];
    const pct = next ? Math.max(0, Math.min(100, (r.pts - cur.min) / Math.max(1, next.min - cur.min) * 100)) : 100;
    return { r, ladder, cur, next, pct };
  }

  function repBar(c) {
    const { r, next, pct } = repParts(c);
    return `<div class="tc-rep r${Math.max(0, Math.min(4, Math.round(Number(r.idx) || 0)))}${next ? '' : ' rmax'}"><div class="tc-rep-fill" style="width:${pct.toFixed(1)}%"></div>
      <span>${esc(r.rank)} · ${num(r.pts)}${next ? ' / ' + num(next.min) : ''}</span></div>`;
  }

  /** Beute, die neueste zuerst */
  function lootList(list, limit) {
    const rows = (list || []).slice().sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, limit);
    if (!rows.length) return '';
    return `<ul class="tc-loot">${rows.map(it => `<li class="q-${qOf(it)}">
      <a class="tc-slot q-${qOf(it)}" href="${itemHref(it.id)}" target="_blank" rel="noopener">${iconImg(it.icon) || svg(SIL.trinket)}</a>
      <span><b>${esc(it.name || 'Gegenstand ' + it.id)}</b><small>${[it.inv || it.slot, it.type, it.from ? 'von ' + it.from : '', it.roll != null ? `gewürfelt ${it.roll}${it.of ? ` (${it.of} Teilnehmer)` : ''}` : '', day(it.at)].filter(Boolean).map(esc).join(' · ')}</small></span>
    </li>`).join('')}</ul>`;
  }

  /* ---------- Reiter ---------- */
  function tabChar(c) {
    const st = c.stats || {};
    const sub = (c.badges || []).find(b => b.t === 'sub');
    return `<div class="tc-doll">
        <div class="tc-col">${SLOTS_LEFT.map(s => slotHtml(c, s)).join('')}</div>
        <div class="tc-mid">
          ${modelHtml(c)}
          <div class="tc-boxes">
            <div class="tc-mini"><div class="tc-mini-h">Im Stream</div>${kv([['Bosse', num(st.bosses)], ['Beute', num(st.loot)], ['Gegner', st.foes != null ? num(st.foes) : null], ['Fische', st.fish != null ? num(st.fish) : null], ['Quiz & Rätsel', st.quiz != null ? num(st.quiz) : null], ['Hergestellt', st.crafted ? num(st.crafted) : null], ['Tagesquests', st.quests ? num(st.quests) : null], ['Duelle', st.duels ? `${num(st.duelsWon || 0)} von ${num(st.duels)} gewonnen` : null]])}</div>
            <div class="tc-mini"><div class="tc-mini-h">Twitch</div>${kv([['Dabei seit', day(st.since)], ['Nachrichten', num(st.messages)], ['Punkte eingesetzt', st.points != null ? num(st.points) : null], ['Abo', sub ? `${num(sub.months || 1)} Mon.` : null]])}</div>
          </div>
        </div>
        <div class="tc-col">${SLOTS_RIGHT.map(s => slotHtml(c, s)).join('')}</div>
      </div>
      <div class="tc-weapons">${SLOTS_BOTTOM.map(s => slotHtml(c, s)).join('')}</div>
      <div class="tc-iteminfo">${itemInfoHtml(c)}</div>`;
  }

  function tabRep(c) {
    const { r, ladder, next } = repParts(c);
    return `<div class="tc-page">
      <h3>Ruf bei ${esc(CONFIG.streamer)}</h3>
      <p>Ruf gibt es fürs Zuschauen und Mitmachen im Stream – im Chat, bei Pausen-Spielen und Bosskämpfen.</p>
      ${repBar(c)}
      <p style="margin-top:8px">${next ? `Noch ${num(next.min - r.pts)} Ruf bis „${esc(next.name)}“.` : 'Höchster Rang erreicht.'}</p>
      <ul class="tc-ladder">${ladder.map((l, i) => `<li class="${i < r.idx ? 'done' : i === r.idx ? 'cur' : ''}"><span>${esc(l.name)}</span><span>ab ${num(l.min)}</span></li>`).join('')}</ul>
    </div>`;
  }

  function tabLoot(c) {
    return `<div class="tc-page"><h3>Erbeutete Gegenstände</h3>
      ${lootList(c.loot, 100) || '<div class="tc-nothing">Noch keine Beute – besiege im Stream mit dem Chat einen Boss!</div>'}</div>`;
  }

  /** Berufe: Fertigkeit wie im Fenster „Fertigkeiten“ (Lehrling bis 75, Geselle bis 150 …) */
  function tabProfs(c) {
    const list = Array.isArray(c.profs) ? c.profs.filter(p => p && (PROFS[p.id] || (data.profs && data.profs[p.id]))) : [];
    const cap = Math.max(75, Math.min(300, Number(c.cap) || 75));
    const row = (p) => {
      const d = (data.profs && data.profs[p.id]) || {};
      const name = d.name || PROFS[p.id][0];
      const icon = d.icon || PROFS[p.id][1];
      const skill = Math.max(1, Math.min(300, Math.round(Number(p.skill) || 1)));
      const max = Math.max(skill, cap);
      const rank = (PROF_RANKS.find(r => max <= r[0]) || PROF_RANKS[3])[1]; // der Rang richtet sich nach der höchsten erlernbaren Fertigkeit
      return `<div class="tc-skill">${iconImg(icon)}<div class="tc-skill-h"><b>${esc(name)}</b><small>${rank}</small></div>
        <div class="tc-skill-bar"><div class="tc-skill-fill" style="width:${(skill / max * 100).toFixed(1)}%"></div><span>${num(skill)} / ${num(max)}</span></div></div>`;
    };
    const main = list.filter(p => !SECONDARY.includes(p.id));
    const second = list.filter(p => SECONDARY.includes(p.id));
    return `<div class="tc-page"><h3>Berufe</h3>
      ${main.length ? `<div class="tc-skills">${main.map(row).join('')}</div>` : '<p>Noch keine Hauptberufe – im Stream mit <b>!beruf</b> zwei wählen, z.B. <b>!beruf Bergbau Schmiedekunst</b>.</p>'}
      <h3>Sekundäre Fertigkeiten</h3>
      ${second.length ? `<div class="tc-skills">${second.map(row).join('')}</div>` : '<p>Kochkunst, Erste Hilfe und Angeln kann jeder – gekocht wird von selbst, solange du im Stream schreibst, verbunden im Kampf mit <b>!verbinden</b>, geangelt bei Fischschwärmen und in der Pause.</p>'}
    </div>`;
  }

  /** Ehre: Rang wie im Spiel (14 Ränge je Seite), Rangpunkte bis zum nächsten Rang, Ehre & Ehrenabzeichen */
  function tabPvp(c) {
    const p = c.pvp;
    const d = data.pvp;
    if (!p || !d || !d.ranks) return '<div class="tc-page"><h3>Ehre</h3><div class="tc-nothing">Noch keine Ehre – die gibt es im Stream für Duelle (<b>!duell @name</b>) und die Schlacht um die Darkspear-Inseln in der Pause.</div></div>';
    const side = faction(c) === 'horde' ? 'horde' : 'allianz';
    const names = d.ranks[side] || [];
    const pts = d.pts || [];
    const icon = (r) => `achievement_pvp_${side === 'horde' ? 'h' : 'a'}_${String(r).padStart(2, '0')}`;
    const r = Math.max(0, Math.min(names.length, Number(p.rank) || 0));
    const lo = r > 0 ? pts[r - 1] : 0;
    const hi = pts[r];
    const bar = hi ? `<div class="tc-skill-bar"><div class="tc-skill-fill" style="width:${Math.max(0, Math.min(100, ((p.rp || 0) - lo) / (hi - lo) * 100)).toFixed(1)}%"></div><span>${num(p.rp)} / ${num(hi)} Rangpunkte</span></div>`
      : `<div class="tc-skill-bar"><div class="tc-skill-fill" style="width:100%"></div><span>${num(p.rp)} Rangpunkte – höchster Rang</span></div>`;
    return `<div class="tc-page">
      <h3>Ehre</h3>
      <div class="tc-rank">${r ? iconImg(icon(r)) : '<span></span>'}<b>${r ? `${esc(names[r - 1])} (Rang ${r})` : 'Noch ohne Rang'}</b><small>Saison ${num(d.season)} · Woche ${num(d.week)} von ${num(d.seasonWeeks)}${hi ? ` · nächster Rang: ${esc(names[r])}` : ''}</small></div>
      ${bar}
      ${kv([['Ehre', num(p.honor)], ['Ehrenabzeichen', num(p.marks)], ['Bester Rang', p.best ? `${esc(p.bestName || names[p.best - 1] || '')} (Rang ${num(p.best)})` : '–'], ['Darkspear-Inseln', `${num(p.bgWins)} von ${num(p.bgGames)} gewonnen`], ['Duelle', `${num(p.duelsWon)} von ${num(p.duels)} gewonnen`]])}
      <p style="margin-top:12px">Rangpunkte gibt es für Duelle und die Schlacht um die Darkspear-Inseln. Mit jeder Saison beginnen sie neu – der beste Rang bleibt.</p>
      <ul class="tc-ladder tc-ranks">${names.map((n, i) => `<li class="${i + 1 < r ? 'done' : i + 1 === r ? 'cur' : ''}"><span>${iconImg(icon(i + 1))}${esc(n)}</span><span>ab ${num(pts[i])}</span></li>`).join('')}</ul>
    </div>`;
  }

  /** Vermächtnis: Herausforderungen (je 1 Punkt) nach Bereichen, verteilte Vorteile, Belohnungsweg */
  function tabAch(c) {
    const dict = data.achievements || {};
    const L = data.legacy || {};
    const list = (Array.isArray(c.ach) ? c.ach : []).filter(a => a && dict[a.id]);
    const own = c.legacy || {};
    const pts = own.pts != null ? own.pts : c.achPts != null ? c.achPts : list.length;
    const perks = {};
    (L.trees || []).forEach(t => (t.perks || []).forEach(p => { perks[p.id] = Object.assign({ tree: t.name }, p); }));
    const mine = (own.perks || []).filter(p => perks[p.id]);
    const got = new Set(own.rewards || []);
    const cats = (L.cats || []).filter(k => list.some(a => dict[a.id].cat === k.id));
    const rest = list.filter(a => !(L.cats || []).some(k => k.id === dict[a.id].cat));
    const row = (a) => {
      const d = dict[a.id];
      return `<li>${iconImg(d.icon) || '<span></span>'}<span><b>${esc(d.name)}</b><small>${esc(d.desc)}${a.at ? ' · ' + day(a.at) : ''}</small></span><span class="tc-pts">1</span></li>`;
    };
    return `<div class="tc-page">
      <div class="tc-achhead"><h3 style="margin:0">Vermächtnis</h3><span class="tc-achpts">${num(pts)} ${pts === 1 ? 'Punkt' : 'Punkte'}</span>${c.title ? `<span>Titel: <b style="color:var(--tc-gold)">${esc(c.name)}, ${esc(c.title)}</b></span>` : ''}</div>
      <p>Jede Vermächtnisherausforderung bringt einen Punkt. Ab Stufe 25 (oder einem Herstellungsberuf auf 150) werden sie automatisch auf Vorteile verteilt – höchstens ${num(L.max || own.max || 16)}. Im Stream zeigt <b>!vermächtnis</b> sie an.</p>
      ${mine.length ? `<ul class="tc-achs">${mine.map(p => `<li>${iconImg(perks[p.id].icon) || '<span></span>'}<span><b>${esc(perks[p.id].name)}</b><small>${esc(perks[p.id].tree)}${p.text ? ' · ' + esc(p.text) : ''}</small></span><span class="tc-pts">${num(p.rank)}/${num(perks[p.id].max)}</span></li>`).join('')}</ul>`
        : `<p>${own.open ? 'Noch keine Vorteile verteilt.' : 'Vorteile gibt es ab Stufe 25.'}</p>`}
      ${(L.rewards || []).length ? `<div class="tc-cat">Vermächtnisbelohnungsweg</div><ul class="tc-achs">${L.rewards.map(r => `<li class="${got.has(r.id) || pts >= r.pts ? '' : 'off'}">${iconImg(r.icon) || '<span></span>'}<span><b>${esc(r.name)}</b><small>ab ${num(r.pts)} Punkten${got.has(r.id) || pts >= r.pts ? ' · erreicht' : ` · noch ${num(r.pts - pts)}`}</small></span><span class="tc-pts">${num(r.pts)}</span></li>`).join('')}</ul>` : ''}
      ${list.length ? cats.map(k => `<div class="tc-cat">${esc(k.name)}</div><ul class="tc-achs">${list.filter(a => dict[a.id].cat === k.id).map(row).join('')}</ul>`).join('')
        + (rest.length ? `<ul class="tc-achs">${rest.map(row).join('')}</ul>` : '')
        : '<div class="tc-nothing">Noch keine Herausforderungen geschafft – die gibt es für Stufen, Berufe, Duelle, die Darkspear-Inseln, Gegner, Dungeons und Weltbosse.</div>'}
    </div>`;
  }

  /** Talente: drei Bäume der Klasse wie im Talentfenster – Punkte gehen automatisch in den gewählten, Schlüsseltalente mit 21 und 31 Punkten */
  function tabTal(c) {
    const T = data.talents || {};
    const trees = (T.classes && T.classes[c.cls]) || [];
    if (!trees.length) return '<div class="tc-page"><h3>Talente</h3><div class="tc-nothing">Für diese Klasse gibt es noch keine Talente.</div></div>';
    const own = c.talent || {};
    const max = T.max || 51;
    const start = T.start || 10;
    const pts = Math.max(0, Math.min(max, Math.round(Number(own.pts) || 0)));
    const cur = trees.find(t => t.id === own.tree);
    const st = c.stats || {};
    const pct = (role) => ((T.effect || {})[role] || 0) * pts / max;
    const de = (n) => n.toLocaleString('de-DE', { maximumFractionDigits: 1 });
    const effect = !cur || !pts ? ''
      : cur.role === 'tank' ? `fängt <b>${de(pct('tank'))} %</b> der Schläge ab, die einen Helden der Gruppe niederstrecken würden${st.blocks ? ` · bisher ${num(st.blocks)}× abgefangen` : ''}`
        : cur.role === 'heal' ? `rettet <b>${de(pct('heal'))} %</b> der Gefallenen, gegen Boss-Fähigkeiten halb so oft${st.saves ? ` · bisher ${num(st.saves)} gerettet` : ''}`
          : `<b>+${de(pct('dmg'))} %</b> Schaden`;
    const level = (at) => at + start - 1; // 21 Punkte = Stufe 30
    const spellHref = (id) => `https://www.wowhead.com/${CONFIG.wowheadDb ? CONFIG.wowheadDb + '/' : ''}de/spell=${encodeURIComponent(id)}`;
    const tree = (t) => {
      const on = cur && cur.id === t.id;
      const have = on ? pts : 0;
      return `<div class="tc-tree${on ? ' on' : ''}">
        <div class="tc-tree-h">${iconImg(t.icon) || '<span></span>'}<span><b>${esc(t.name)}</b><small>${esc((T.roles || {})[t.role] || '')}${on ? ' · gewählt' : ''}</small></span></div>
        <div class="tc-skill-bar"><div class="tc-skill-fill" style="width:${(have / max * 100).toFixed(1)}%"></div><span>${num(have)} / ${num(max)}</span></div>
        <ul class="tc-achs">${(t.keys || []).map(k => `<li class="${have >= k.at ? '' : 'off'}"><a href="${spellHref(k.id)}" target="_blank" rel="noopener">${iconImg(k.icon) || '<span></span>'}</a><span><b>${esc(k.name)}</b><small>${have >= k.at ? 'gelernt' : `ab ${num(k.at)} Punkten · Stufe ${num(level(k.at))}`}</small></span></li>`).join('')}</ul>
      </div>`;
    };
    const intro = !cur ? `Ab Stufe ${num(start)} gibt es je Stufe einen Talentpunkt, ${num(max)} auf Stufe 60. Im Stream mit <b>!talente Baum</b> wählen – wer nicht wählt, bekommt mit Stufe ${num(start)} einen zugeteilt.`
      : !pts ? `${esc(c.name)} lernt ${esc(cur.name)} – die Punkte kommen ab Stufe ${num(start)}. Wechseln im Stream mit <b>!talente Baum</b>.`
        : `Je Stufe ab ${num(start)} ein Punkt, verteilt wird automatisch.${own.auto ? ' Der Baum wurde mit Stufe 10 zugeteilt – einmal kostenlos wechseln mit <b>!talente Baum</b>.' : ' Wechseln im Stream mit <b>!talente Baum</b>.'}`;
    return `<div class="tc-page">
      <div class="tc-achhead"><h3 style="margin:0">Talente</h3><span class="tc-achpts">${num(pts)} / ${num(max)} Punkte</span>${cur ? `<span>${esc(cur.name)}</span>` : ''}</div>
      <p>${intro}</p>
      <div class="tc-trees">${trees.map(tree).join('')}</div>
      ${effect ? `<div class="tc-effect">Im Kampf: ${effect}</div>` : ''}
    </div>`;
  }

  function tabBadges(c) {
    const rows = (c.badges || []).filter(b => MARKS[b.t]).map(b => {
      const m = MARKS[b.t];
      return `<div class="tc-badgerow"><span class="tc-mark">${svg(m.svg, m.color)}</span><span><b style="color:${m.color}">${m.name}</b>${b.months ? ` · ${num(b.months)} ${b.months === 1 ? 'Monat' : 'Monate'}` : ''}${b.t === 'undefeated' ? ` · ${b.fights ? num(b.fights) + ' Kämpfe, ' : ''}nie gefallen` : ''}</span></div>`;
    }).join('');
    return `<div class="tc-page"><h3>Abzeichen</h3>
      <p>Abzeichen aus dem Twitch-Chat – sie werden bei der nächsten Nachricht im Stream aktualisiert. „Unbezwungen“ trägt, wer 25 Kämpfe bestritten hat, ohne je zu fallen – beim ersten Sturz ist es weg.</p>
      ${rows ? `<div class="tc-badgelist">${rows}</div>` : '<div class="tc-nothing">Noch keine Abzeichen.</div>'}</div>`;
  }

  /* ---------- Wertefenster rechts ---------- */
  function sideHtml(c) {
    const g = gearStats(c);
    const { r, next } = repParts(c);
    const sec = (id, title, body) => `<div class="tc-sec${ui.shut[id] ? ' shut' : ''}"><button type="button" class="tc-sec-h" data-sec="${id}">${title}</button>${body}</div>`;
    const recent = lootList(c.loot, 3);
    return `<div class="tc-box tc-side">
      ${sec('gen', 'Allgemein', kv([['Stufe', c.level ? num(levelOf(c)) : null], ['Volk', esc(raceName(c))], ['Klasse', `<span style="color:${cls(c).color}">${esc(className(c))}</span>`], ['Talente', talentName(c)], ['Fraktion', FACTIONS[faction(c)]], ['Gegenstandsstufe', g.ilvl != null ? num(g.ilvl) : '–'], ['Ausgerüstet', `${g.worn} / ${ALL_SLOTS.length}`]]) + xpBar(c))}
      ${sec('rep', 'Ruf', kv([['Rang', esc(r.rank)], ['Ruf', num(r.pts)], ['Nächster Rang', next ? esc(next.name) : '–'], ['Fehlt noch', next ? num(next.min - r.pts) : '–']]))}
      ${c.pvp ? sec('pvp', 'Ehre', kv([['Rang', c.pvp.rank ? `${esc(c.pvp.name)} (${num(c.pvp.rank)})` : '–'], ['Rangpunkte', num(c.pvp.rp)], ['Ehre', num(c.pvp.honor)], ['Bester Rang', c.pvp.best ? esc(c.pvp.bestName) : '–']])) : ''}
      ${sec('loot', 'Letzte Beute', `<div class="tc-sec-body">${recent || '<span style="color:var(--tc-muted)">Noch keine Beute.</span>'}</div>`)}
      ${Array.isArray(c.log) && c.log.length ? sec('log', 'Zuletzt', `<div class="tc-sec-body"><ul class="tc-log">${c.log.slice(0, 10).map(e => `<li><span>${esc(e.text)}</span><small>${esc(ago(e.at))}</small></li>`).join('')}</ul></div>`) : ''}
    </div>`;
  }

  /** „Vergeltung (51)“ – leer, solange kein Baum gewählt ist */
  function talentName(c) {
    const trees = (data.talents && data.talents.classes && data.talents.classes[c.cls]) || [];
    const t = c.talent && trees.find(x => x.id === c.talent.tree);
    return t ? `${esc(t.name)} (${num(c.talent.pts || 0)})` : null;
  }

  /** Erfahrungsbalken (bei Stufe 60 voll) */
  function xpBar(c) {
    if (!c.level) return '';
    const x = c.xp || {};
    const max = levelOf(c) >= 60 || !x.need;
    const pct = max ? 100 : Math.max(0, Math.min(100, (Number(x.have) || 0) / x.need * 100));
    return `<div class="tc-xp" title="Erfahrung"><div class="tc-xp-fill" style="width:${pct.toFixed(1)}%"></div><span>${max ? 'Höchststufe' : `${num(x.have)} / ${num(x.need)} EP`}</span></div>`;
  }

  /* ---------- Ganzes Fenster ---------- */
  const TABS = [['char', 'Charakter'], ['tal', 'Talente'], ['rep', 'Ruf'], ['pvp', 'Ehre'], ['loot', 'Beute'], ['profs', 'Berufe'], ['ach', 'Vermächtnis'], ['badges', 'Abzeichen']];

  function renderSheet() {
    const sheet = $('.tc-sheet');
    const c = ui.login && data.characters[ui.login];
    if (!c) { sheet.hidden = true; sheet.innerHTML = ''; return; }
    const portrait = portraitOf(c);
    const tabs = TABS.filter(([id]) => id !== 'tal' || data.talents); // Talente nur, wenn die Stream-Zentrale sie schickt
    const body = ({ tal: data.talents ? tabTal : null, rep: tabRep, pvp: tabPvp, loot: tabLoot, profs: tabProfs, ach: tabAch, badges: tabBadges }[ui.tab] || tabChar)(c);
    sheet.innerHTML = `<div class="tc-win">
      <div class="tc-pane">
        <div class="tc-avatar ${faction(c)}">${portrait ? `<img src="${esc(portrait)}" alt="">` : esc(raceName(c).slice(0, 1))}</div>
        <div class="tc-box">
          <div class="tc-title">
            <div class="tc-name" style="color:${cls(c).color}">${esc(c.name)}${c.title ? `<span class="tc-ttl">, ${esc(c.title)}</span>` : ''}</div>
            <div class="tc-sub">${esc(lvlText(c) + raceName(c))} · ${esc(className(c))} · ${FACTIONS[faction(c)]}</div>
            <button type="button" class="tc-close" data-act="close" title="Schließen – alle Charaktere" aria-label="Schließen">×</button>
            <button type="button" class="tc-copy" data-act="copy">Link kopieren</button>
          </div>
          ${body}
        </div>
        <div class="tc-tabs">${tabs.map(([id, label]) => `<button type="button" class="tc-tab${ui.tab === id ? ' on' : ''}" data-tab="${id}">${label}</button>`).join('')}</div>
      </div>
      ${sideHtml(c)}
    </div>`;
    sheet.hidden = false;
    if (window.$WowheadPower && window.$WowheadPower.refreshLinks) window.$WowheadPower.refreshLinks();
  }

  function route() {
    let login = location.hash.replace(/^#/, '');
    try { login = decodeURIComponent(login); } catch (e) { /* kaputte Adresse – so lassen */ }
    login = login.toLowerCase();
    const changed = login !== ui.login;
    ui.login = login;
    if (changed) { ui.tab = 'char'; ui.slot = ''; }
    renderSheet();
    if (changed && data.characters[login]) $('.tc-sheet').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act], [data-tab], [data-sec], button[data-slot], [data-pick]');
    if (!t) {
      // Gefüllter Platz: auf dem Handy erst anzeigen, beim zweiten Tippen zu Wowhead
      const a = e.target.closest('a[data-slot]');
      if (a && ui.slot !== a.dataset.slot && matchMedia('(hover: none)').matches) { e.preventDefault(); ui.slot = a.dataset.slot; renderSheet(); }
      else if (a) { ui.slot = a.dataset.slot; }
      return;
    }
    if (t.dataset.tab) { ui.tab = t.dataset.tab; renderSheet(); return; }
    if (t.dataset.sec) { ui.shut[t.dataset.sec] = !ui.shut[t.dataset.sec]; renderSheet(); return; }
    if (t.dataset.slot) { ui.slot = ui.slot === t.dataset.slot ? '' : t.dataset.slot; renderSheet(); return; }
    if (t.dataset.pick) { ui.slot = ui.slot === t.dataset.pick ? '' : t.dataset.pick; renderSheet(); return; }
    if (t.dataset.act === 'close') { history.replaceState(null, '', location.pathname + location.search); ui.login = ''; renderSheet(); return; }
    if (t.dataset.act === 'copy') {
      const url = location.href;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { t.textContent = 'Kopiert'; }, () => { t.textContent = url; });
      setTimeout(() => { t.textContent = 'Link kopieren'; }, 2500);
    }
  });
  // Mit der Maus über einem gefüllten Platz: Details in der Zeile darunter (Wowhead zeigt dazu den Tooltip)
  root.addEventListener('mouseover', (e) => {
    const a = e.target.closest('a[data-slot]');
    if (!a || ui.slot === a.dataset.slot) return;
    ui.slot = a.dataset.slot;
    const c = data.characters[ui.login];
    root.querySelectorAll('.tc-slot.sel, .tc-gp.sel').forEach(el => el.classList.remove('sel'));
    a.classList.add('sel');
    const g = root.querySelector(`.tc-gp[data-pick="${a.dataset.slot}"]`);
    if (g) g.classList.add('sel');
    const info = $('.tc-iteminfo');
    if (c && info) info.innerHTML = itemInfoHtml(c);
  });
  $('.tc-search').addEventListener('input', renderList);
  window.addEventListener('hashchange', route);

  /* ---------- Wowhead-Tooltips (deutsch) beim Drüberfahren über Gegenstände ---------- */
  window.whTooltips = { colorLinks: false, iconizeLinks: false, renameLinks: false };
  if (!document.querySelector('script[src*="zamimg.com/js/tooltips.js"]')) {
    const s = document.createElement('script');
    s.src = 'https://wow.zamimg.com/js/tooltips.js';
    s.async = true;
    document.head.appendChild(s);
  }

  /* ---------- Daten laden ---------- */
  function start(d) {
    data = d && d.characters ? d : { characters: {} };
    data.characters = Object.assign(Object.create(null), data.characters); // ohne Prototyp: #constructor öffnet kein Phantom-Fenster
    // Name, Symbol & Co. stehen einmal in data.items – bei Ausrüstung und Beute nur die Nummer
    const items = data.items && typeof data.items === 'object' ? data.items : {};
    const full = (ref) => ref && typeof ref === 'object' ? Object.assign({}, items[ref.id], ref) : ref;
    Object.values(data.characters).forEach(c => {
      if (!c || typeof c !== 'object') return;
      if (c.gear && typeof c.gear === 'object') Object.keys(c.gear).forEach(k => { c.gear[k] = full(c.gear[k]); });
      if (Array.isArray(c.loot)) c.loot = c.loot.map(full);
    });
    renderList();
    route();
  }
  if (!CONFIG.dataUrl) { start(Object.assign({ sample: true }, SAMPLE)); return; }
  fetch(CONFIG.dataUrl + (CONFIG.dataUrl.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000)) // der Minuten-Zusatz hält die Daten frisch, der Browser darf sie innerhalb der Minute wiederverwenden
    .then(r => {
      if (r.status === 404) return null; // Datei gibt es noch nicht – die Stream-Zentrale lädt sie beim ersten Helden hoch
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(d => {
      start(d);
      if (!d) $('.tc-foot').textContent = 'Noch keine Charaktere – sobald im Stream jemand mit !charakter einen Helden erstellt, erscheint er hier.';
    })
    .catch(() => {
      start(null);
      $('.tc-foot').textContent = 'Die Charaktere konnten gerade nicht geladen werden – bitte später noch einmal versuchen.';
    });
})();
</script>
