<!-- =====================================================================
     Mitspielen für trutzstaehler.de (Squarespace, Code-Block)
     Erklärt, wie der Chat im Stream mitspielt – aufgeteilt in Themen: oben
     ein Menü (Los geht’s, Kämpfe, Talente, Berufe, Pause, Ehre & Rang,
     Quests & Vermächtnis, Völker & Klassen, Alle Befehle), darunter immer nur
     das gewählte Thema. Jedes Thema hat eine eigene Adresse, z.B.
     trutzstaehler.de/mitspielen#talente.
     „Alle Befehle“ zeigt die Chat-Befehle so, wie sie gerade in der
     Stream-Zentrale eingestellt sind (aus derselben Datei wie die
     Charakterseite). Ohne Datei erscheinen die Standard-Befehle.
     Einfügen: Seite bearbeiten → Block hinzufügen → Code → alles hier
     einfügen („Quelltext anzeigen“ aus).
     ===================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Asul:wght@400;700&family=Cinzel:wght@700&display=swap" rel="stylesheet">

<div id="tsz-play" class="tp">
  <h2 class="tp-h">Mitspielen</h2>
  <p class="tp-lead">Im Stream spielt der Chat mit: Jeder kann einen eigenen Helden aus WoW Forever erstellen, mit ihm kämpfen, Talente und Berufe lernen und in den Pausen um Ruf und Beute spielen. Alles läuft über den Twitch-Chat – wähle ein Thema.</p>
  <div class="tp-tabs" role="tablist" aria-label="Themen"></div>
  <div class="tp-body"></div>
</div>

<style>
  #tsz-play {
    --tp-gold: #ffd100;
    --tp-txt: #f3eee2;
    --tp-muted: #b8ad94;
    --tp-ts: 1px 1px 0 #000, 0 1px 3px rgba(0, 0, 0, 0.8);
    --tp-panel: linear-gradient(180deg, #161616 0%, #0c0c0c 100%);
    --tp-line: #4a4a4a;
    --tp-brass: #8c713c;
    max-width: 1100px;
    margin: 0 auto;
    padding: 22px;
    border-radius: 4px;
    background: #120e0b;
    color: var(--tp-txt);
    font: 400 16px/1.5 Asul, Georgia, serif;
    text-align: left;
    container: tp / inline-size; /* richtet sich nach der Breite des Blocks, nicht des Fensters */
  }
  #tsz-play *, #tsz-play *::before, #tsz-play *::after { box-sizing: border-box; }
  #tsz-play [hidden] { display: none !important; }
  #tsz-play .tp-h { margin: 0 0 6px; font: 700 30px/1.2 Cinzel, Georgia, serif; letter-spacing: 0.5px; color: var(--tp-gold); text-shadow: var(--tp-ts); }
  #tsz-play h3 { margin: 0 0 8px; font: 700 20px/1.25 Cinzel, Georgia, serif; color: var(--tp-gold); text-shadow: var(--tp-ts); }
  #tsz-play .tp-lead { margin: 0 0 16px; color: var(--tp-muted); max-width: 820px; }
  #tsz-play code { padding: 1px 6px; border-radius: 3px; background: #000; border: 1px solid #3a3326; color: var(--tp-gold); font: 700 15px/1.4 Consolas, Menlo, monospace; white-space: nowrap; }
  #tsz-play b { color: var(--tp-txt); }
  #tsz-play button { font: inherit; cursor: pointer; }

  /* Themen-Menü */
  #tsz-play .tp-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #2a2a2a; }
  #tsz-play .tp-tab {
    display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 6px; border: 1px solid var(--tp-line); border-radius: 4px;
    background: linear-gradient(180deg, #0f0f0f, #1d1d1d); color: var(--tp-muted); font-size: 15px; font-weight: 700; text-shadow: var(--tp-ts); text-align: left;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  #tsz-play .tp-tab img { width: 24px; height: 24px; flex-shrink: 0; border-radius: 3px; border: 1px solid #000; }
  #tsz-play .tp-tab:hover { color: var(--tp-txt); }
  #tsz-play .tp-tab.on { color: var(--tp-gold); border-color: var(--tp-brass); background: linear-gradient(180deg, #2a2112, #17120a); }
  #tsz-play .tp-tab:focus-visible, #tsz-play .tp-next:focus-visible { outline: 2px solid var(--tp-gold); outline-offset: 2px; }

  /* Ein Thema */
  #tsz-play .tp-sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; }
  #tsz-play .tp-sec-h img { width: 36px; height: 36px; border-radius: 4px; border: 1px solid #000; box-shadow: 0 0 0 1px var(--tp-brass); }
  #tsz-play .tp-sec-h h3 { margin: 0; }
  #tsz-play .tp-intro { margin: 0 0 14px; color: var(--tp-muted); max-width: 820px; }
  #tsz-play .tp-steps { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  #tsz-play .tp-step { display: flex; gap: 12px; padding: 14px 14px 14px 12px; border: 1px solid var(--tp-line); border-radius: 4px; background: var(--tp-panel); }
  #tsz-play .tp-step img { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 4px; border: 1px solid #000; box-shadow: 0 0 0 1px var(--tp-brass); }
  #tsz-play .tp-step h4 { margin: 0 0 4px; font: 700 17px/1.3 Asul, Georgia, serif; color: var(--tp-gold); text-shadow: var(--tp-ts); }
  #tsz-play .tp-step p { margin: 0 0 6px; color: var(--tp-muted); font-size: 15px; }
  #tsz-play .tp-step p:last-child { margin-bottom: 0; }
  #tsz-play .tp-next { display: inline-flex; align-items: center; gap: 7px; margin-top: 4px; padding: 7px 13px; border: 1px solid var(--tp-brass); border-radius: 4px; background: linear-gradient(180deg, #2a2112, #17120a); color: var(--tp-txt); font-weight: 700; text-shadow: var(--tp-ts); }
  #tsz-play .tp-next:hover { border-color: var(--tp-gold); color: var(--tp-gold); }

  /* Karten */
  #tsz-play .tp-card { margin-bottom: 14px; padding: 14px 16px; border: 1px solid var(--tp-line); border-radius: 4px; background: var(--tp-panel); }
  #tsz-play .tp-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  #tsz-play .tp-card-head h3 { margin: 0; }
  #tsz-play .tp-card p { margin: 0; color: var(--tp-muted); }
  #tsz-play .tp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 14px; }
  #tsz-play .tp-grid .tp-card { margin-bottom: 0; }
  #tsz-play .tp-card .tp-note, #tsz-play .tp-note { margin: 8px 0 0; color: var(--tp-muted); font-size: 14px; }
  #tsz-play .tp-search { width: 240px; max-width: 100%; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--tp-brass); background: #0d0b09; color: var(--tp-txt); font: 400 15px Asul, Georgia, serif; outline: none; }
  #tsz-play .tp-search:focus { border-color: var(--tp-gold); }

  /* Befehle */
  #tsz-play .tp-group { margin: 12px 0 4px; font-weight: 700; color: var(--tp-gold); }
  #tsz-play .tp-group:first-child { margin-top: 0; }
  #tsz-play table { width: 100%; border-collapse: collapse; }
  #tsz-play td { padding: 6px 8px; border-top: 1px solid #262626; vertical-align: top; font-size: 15px; }
  #tsz-play td:first-child { width: 38%; }
  #tsz-play td code { white-space: normal; overflow-wrap: anywhere; }

  /* Völker */
  #tsz-play .tp-race { display: grid; grid-template-columns: 34px 190px 1fr; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid #222; font-size: 15px; }
  #tsz-play .tp-race:first-child { border-top: none; }
  #tsz-play .tp-race img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #6b5a33; }
  #tsz-play .tp-race b.horde { color: #e0574f; }
  #tsz-play .tp-race b.allianz { color: #6fa3ff; }
  #tsz-play .tp-cls { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #tsz-play .tp-ladder div { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid #222; }
  #tsz-play .tp-ladder div:first-child { border-top: none; }
  #tsz-play .tp-ladder span:last-child { color: var(--tp-muted); }

  /* Mittel: Menü in drei Spalten */
  @container tp (max-width: 900px) {
    #tsz-play .tp-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  /* Schmal: Menü in zwei Spalten (das letzte allein über die volle Breite), alles untereinander */
  @container tp (max-width: 640px) {
    #tsz-play .tp-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #tsz-play .tp-tab:last-child:nth-child(odd) { grid-column: 1 / -1; }
    #tsz-play .tp-steps, #tsz-play .tp-grid { grid-template-columns: minmax(0, 1fr); }
    #tsz-play table, #tsz-play tbody, #tsz-play tr, #tsz-play td { display: block; width: auto; }
    #tsz-play tr { padding: 6px 0; border-top: 1px solid #262626; }
    #tsz-play td { padding: 2px 4px; border-top: none; }
    #tsz-play td:first-child { width: auto; }
    #tsz-play code { white-space: normal; overflow-wrap: anywhere; }
    #tsz-play .tp-race { grid-template-columns: 30px 1fr; }
    #tsz-play .tp-race .tp-cls { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    #tsz-play { padding: 14px; }
    #tsz-play .tp-h { font-size: 24px; }
  }
</style>

<script>
(function () {
  const CONFIG = {
    dataUrl: 'https://raw.githubusercontent.com/trutzstaehler/stream-daten/main/helden.json' // dieselbe Datei wie die Charakterseite – liefert die aktuellen Befehle
  };

  const icon = (n) => `https://wow.zamimg.com/images/wow/icons/large/${encodeURIComponent(n)}.jpg`;
  // Die Themen – Befehle wie in der Stream-Zentrale (Standard). extra = zusätzliche Karten (siehe EXTRA unten)
  const TOPICS = [
    { id: 'start', label: 'Los geht’s', icon: 'achievement_character_human_male', intro: 'Ein Held, ein Name, ein Chat – mehr braucht es nicht.', extra: ['ladder', 'pace'], steps: [
      { icon: 'achievement_character_human_male', h: 'Helden erstellen', p: ['Einmalig im Chat Volk und Klasse wählen, z.B. <code>!charakter Zwerg Paladin</code> – für eine Heldin ein <code>w</code> dazu. <code>!völker</code> zeigt, wer was sein kann (siehe Völker &amp; Klassen).', 'Danach hat dein Held ein eigenes Charakterfenster auf dieser Website – mit Ausrüstung, Talenten, Ruf, Ehre, Berufen und Vermächtnis. Du findest es über die Suche mit dem vollständigen Namen, die Bestenliste oder den Link, den der Bot schickt.'] },
      { icon: 'achievement_level_10', h: 'Dabei sein: Erfahrung & Ruf', p: ['Wer im Chat schreibt, sammelt Erfahrung und Ruf (beides höchstens einmal pro Minute) – Zuschauen allein bringt auch etwas Ruf.', 'Stufe 1 bis 60 mit derselben Erfahrungstabelle wie in WoW Forever. <code>!ruf</code> zeigt deinen Ruf.'] }
    ] },
    { id: 'kampf', label: 'Kämpfe', icon: 'ability_warrior_offensivestance', intro: 'Gegner im Stream und Duelle unter Helden. Bosse gibt es in der Pause.', steps: [
      { icon: 'ability_warrior_offensivestance', h: 'Gegner im Stream', p: ['Etwa alle 20 Minuten taucht ein Gegner aus WoW Forever auf – vom Jungen Wolf bis zum Rar Elite. Mit <code>!angriff</code> kämpft dein Held mit.', 'Fällt der Gegner rechtzeitig, wird seine Beute offen ausgewürfelt (1–100) – passend zur Klasse. Wer einen Verband dabeihat, holt Gefallene mit <code>!verbinden @name</code> zurück in den Kampf.'] },
      { icon: 'ability_dualwield', h: 'Duelle', p: ['<code>!duell @name</code> fordert einen anderen Helden heraus, der antwortet mit <code>!annehmen</code> oder <code>!ablehnen</code>.', 'Die Siegchance steht offen im Chat: Stufe und Ausrüstung zählen, der Rest ist Würfelglück. Niemand fällt.'] }
    ] },
    { id: 'talente', label: 'Talente', icon: 'inv_misc_book_11', intro: 'Wie in WoW Forever: drei Talentbäume je Klasse, ein Punkt je Stufe ab Stufe 10.', steps: [
      { icon: 'inv_misc_book_11', h: 'Baum wählen', p: ['Ab Stufe 10 gibt es je Stufe einen Talentpunkt, 51 auf Stufe 60 – in einen der drei Bäume deiner Klasse. <code>!talente Vergeltung</code> wählt den Baum, verteilt wird automatisch. <code>!talente</code> allein zeigt Baum, Punkte und Schlüsseltalente.', 'Wer nicht wählt, bekommt mit Stufe 10 einen Baum zugeteilt und kann einmal kostenlos wechseln. Danach gibt es eine Wartezeit, bevor du wieder wechseln kannst.'] },
      { icon: 'spell_holy_heal', h: 'Im Kampf', p: ['Es zählt die Rolle des Baums: Schaden-Bäume treffen härter, Schutz fängt Schläge für die ganze Gruppe ab, Heilung rettet Gefallene. Je mehr Punkte, desto stärker.', 'Mit 21 und 31 Punkten (Stufe 30 und 40) kommen die Schlüsseltalente – Tödlicher Stoß, Schattengestalt, Rasche Heilung und Co. Alles steht im Reiter Talente deines Charakterfensters.'] }
    ] },
    { id: 'berufe', label: 'Berufe', icon: 'trade_mining', intro: 'Sammeln im Stream – den Rest erledigt dein Held von selbst.', steps: [
      { icon: 'trade_mining', h: 'Berufe lernen & sammeln', p: ['Mit <code>!beruf Bergbau Schmiedekunst</code> zwei Hauptberufe wählen. Kochkunst, Erste Hilfe und Angeln kann jeder.', 'Erzvorkommen, Kräuter und Fischschwärme tauchen im Stream auf: <code>!abbauen</code>, <code>!pflücken</code>, <code>!angeln</code>.'] },
      { icon: 'inv_misc_note_01', h: 'Was von selbst passiert', p: ['Solange du im Stream schreibst, stellt dein Held her, kocht und entzaubert, legt bessere Ausrüstung an und nimmt Essen und Tränke mit in die Kämpfe.', '<code>!rucksack</code> und <code>!rezepte</code> zeigen, was er hat und kann.'] }
    ] },
    { id: 'pause', label: 'Pause', icon: 'inv_misc_pocketwatch_01', intro: 'Zwei kurze Pausen pro Stream – und nach jedem Spiel kommt ein anderes.', steps: [
      { icon: 'inv_misc_pocketwatch_01', h: 'In der Pause', p: ['Bosskampf (<code>!angriff</code> und schnell auf Fähigkeiten reagieren), Azeroth-Quiz (<code>!a</code> bis <code>!d</code>), die Schlacht um die Darkspear-Inseln, Angeln und Azeroth-Rätsel. Die Pause dauert, bis Trutz zurück ist – das letzte Spiel wird immer noch zu Ende gespielt.', 'Dazu die Pausen-Truhe für alle, die bis zum Schluss dabei bleiben, und das Lagerfeuer: Wer in der Pause schreibt, stellt sein bestes Berufsobjekt von selbst dazu – wer am besten kocht, baut ein größeres Feuer.'] },
      { icon: 'inv_misc_rune_14', h: 'Schlacht um die Darkspear-Inseln', p: ['Das Schlachtfeld aus WoW Forever: Allianz gegen Horde um vier Stützpunkte. Helden stürmen mit <code>!sturm</code> (oder <code>!sturm 1</code> bis <code>4</code>) für ihre Seite, mit <code>!flagge</code> tragen sie die Flagge zu einem eigenen Stützpunkt.', 'Ohne Helden feuerst du mit <code>!allianz</code> oder <code>!horde</code> an. Die Seite mit den meisten Stützpunkten sammelt am schnellsten Punkte – wer zuerst 2.000 hat, gewinnt.'] }
    ] },
    { id: 'ehre', label: 'Ehre & Rang', icon: 'achievement_pvp_a_14', intro: 'Für Duelle und die Darkspear-Inseln – wie das Ehrensystem in WoW Forever.', steps: [
      { icon: 'achievement_pvp_a_14', h: 'Ehre & Rang', p: ['Duelle und die Darkspear-Inseln bringen Ehre und Rangpunkte – 14 Ränge je Seite, vom Gefreiten bis zum Großmarschall, vom Späher bis zum Obersten Kriegsfürsten. <code>!rang</code> zeigt deinen.', 'Jede Woche geht es etwas höher, Rang 14 gibt es erst in der letzten Woche der Saison. Mit jeder Saison beginnen die Rangpunkte neu – der beste Rang bleibt.'] }
    ] },
    { id: 'quests', label: 'Quests & Vermächtnis', icon: 'inv_misc_book_09', intro: 'Jeden Tag etwas zu tun – und Herausforderungen für die lange Reise.', steps: [
      { icon: 'inv_misc_book_09', h: 'Tagesquests', p: ['<code>!quests</code> zeigt drei Aufgaben für heute (Wechsel um 4 Uhr) – sie bringen viel Erfahrung und Ruf, alle drei zusammen einen Gegenstand.'] },
      { icon: 'inv_scroll_03', h: 'Vermächtnis & Titel', p: ['Vermächtnisherausforderungen wie in WoW Forever bringen je einen Punkt. Ab Stufe 25 werden sie automatisch auf Vorteile verteilt, <code>!vermächtnis</code> zeigt sie – und ab 15, 25, 40 und 55 Punkten gibt es den Belohnungsweg bis zu den Zügeln des Spektralbären.', '<code>!titel Name</code> wählt einen Titel wie „die Unbezwungene“.'] }
    ] },
    { id: 'voelker', label: 'Völker & Klassen', icon: 'achievement_character_orc_male', intro: 'Wer was sein kann – die Tabelle von WoW Forever.', extra: ['races'] },
    { id: 'befehle', label: 'Alle Befehle', icon: 'inv_misc_spyglass_02', extra: ['cmds'] }
  ];
  // Standard-Befehle, solange die Datei fehlt
  const FALLBACK = [
    ['Helden', '!charakter Volk Klasse', 'Einmalig einen Helden erstellen – ohne Angabe: den eigenen zeigen', ''],
    ['Helden', '!völker', 'Welches Volk welche Klasse spielen kann', ''],
    ['Helden', '!angriff', 'Gegen den Gegner im Stream oder den Boss in der Pause mitkämpfen', ''],
    ['Helden', '!talente · !talente Baum', 'Talentbaum zeigen oder wählen – ab Stufe 10 ein Punkt je Stufe', ''],
    ['Helden', '!beruf Beruf1 Beruf2', 'Zwei Hauptberufe wählen', ''],
    ['Helden', '!abbauen · !pflücken · !angeln', 'Erz, Kräuter oder Fischschwarm im Stream sammeln', ''],
    ['Helden', '!rucksack · !rezepte', 'Rucksack und Rezepte zeigen – hergestellt wird von selbst', ''],
    ['Helden', '!quests · !vermächtnis · !titel Name', 'Tagesquests, Vermächtnis zeigen, Titel wählen', ''],
    ['Helden', '!rang', 'Rang, Rangpunkte und Ehre zeigen', ''],
    ['Helden', '!duell @name · !annehmen · !ablehnen', 'Einen anderen Helden zum Duell fordern', ''],
    ['Helden', '!wowhead Name', 'Link zu Wowhead (WoW Forever, deutsch)', ''],
    ['Ruf', '!ruf', 'Den eigenen Ruf zeigen', ''],
    ['Pause', '!a · !b · !c · !d', 'Antwort im Azeroth-Quiz', ''],
    ['Pause', '!sturm · !sturm 1–4 · !flagge', 'Darkspear-Inseln: mit dem Helden einen Stützpunkt stürmen, die Flagge tragen', ''],
    ['Pause', '!allianz · !horde', 'Darkspear-Inseln: ohne Helden anfeuern', '']
  ];
  // Wer kann was werden – Tabelle von WoW Forever (wie in der Stream-Zentrale)
  const RACES = [
    ['mensch', 'human', 'Mensch', 'allianz', 'Krieger, Jäger, Magier, Schurke, Priester, Hexenmeister, Paladin'],
    ['zwerg', 'dwarf', 'Zwerg', 'allianz', 'Krieger, Jäger, Schurke, Priester, Paladin, Schamane'],
    ['nachtelf', 'nightelf', 'Nachtelf', 'allianz', 'Krieger, Jäger, Schurke, Priester, Druide'],
    ['gnom', 'gnome', 'Gnom', 'allianz', 'Krieger, Magier, Schurke, Priester, Hexenmeister'],
    ['himmelsgeborene', 'skyborne', 'Himmelsgeborene', 'allianz', 'Krieger, Jäger, Magier, Schurke, Druide'],
    ['orc', 'orc', 'Orc', 'horde', 'Krieger, Jäger, Magier, Schurke, Hexenmeister, Schamane'],
    ['troll', 'troll', 'Troll', 'horde', 'Krieger, Jäger, Magier, Schurke, Priester, Hexenmeister, Schamane'],
    ['tauren', 'tauren', 'Tauren', 'horde', 'Krieger, Jäger, Druide, Schamane'],
    ['untote', 'scourge', 'Untote', 'horde', 'Krieger, Magier, Schurke, Priester, Hexenmeister, Paladin'],
    ['himmelsgeborene', 'skyborne', 'Himmelsgeborene', 'horde', 'Krieger, Jäger, Schurke, Druide, Schamane']
  ];
  const LADDER = [{ name: 'Neutral', min: 0 }, { name: 'Freundlich', min: 3000 }, { name: 'Wohlwollend', min: 9000 }, { name: 'Respektvoll', min: 21000 }, { name: 'Ehrfürchtig', min: 42000 }];

  const root = document.getElementById('tsz-play');
  if (!root) return;
  const $ = (sel) => root.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('de-DE');
  let cmds = FALLBACK.map(([group, cmd, desc, who]) => ({ group, cmd, desc, who }));
  let live = false;
  let tab = TOPICS[0].id;

  // Zusätzliche Karten einzelner Themen
  const EXTRA = {
    ladder: () => `<div class="tp-card"><h3 class="tp-rep-h">Ruf bei der Stahlgarde</h3><div class="tp-ladder"></div>
      <p class="tp-note">Ruf gibt es fürs Zuschauen, Schreiben, Kämpfe und die Pausen-Spiele – nie für Spam: eine Nachricht zählt höchstens einmal pro Minute.</p></div>`,
    pace: () => `<div class="tp-card"><h3>Wie lange dauert das?</h3>
      <p>Alles ist auf eine lange Reise ausgelegt – wie in WoW Forever selbst. Bei rund zehn Stream-Stunden pro Woche braucht selbst jemand, der jeden Stream mitmacht, etwa <b>ein Jahr</b> bis Stufe 60, bis Ehrfürchtig und bis ein Beruf auf 300 steht. Die Erfahrungstabelle ist dieselbe wie im Spiel. Wer seltener dabei ist, kommt langsamer voran – verloren geht nichts.</p></div>`,
    races: () => `<div class="tp-card"><div class="tp-races">${RACES.map(([, ic, name, side, classes]) => `<div class="tp-race"><img src="https://wow.zamimg.com/images/wow/icons/large/race_${ic}_male.jpg" alt="" loading="lazy"><b class="${side}">${esc(name)} <small>(${side === 'horde' ? 'Horde' : 'Allianz'})</small></b><span class="tp-cls">${esc(classes)}</span></div>`).join('')}</div>
      <p class="tp-note">Himmelsgeborene gibt es auf beiden Seiten: <code>!charakter Horde Himmelsgeborene Druide</code>. Für eine Heldin ein <code>w</code> dazuschreiben.</p></div>`,
    cmds: () => `<div class="tp-card"><div class="tp-card-head"><h3>Alle Befehle</h3><input class="tp-search" type="search" placeholder="Befehl suchen …" aria-label="Befehl suchen"></div>
      <div class="tp-cmds"></div><p class="tp-note tp-cmd-note"></p></div>
      <div class="tp-card"><h3>Nachschlagen</h3><p><code>!wowhead Arkanitschnitter</code> schickt den Link zur deutschen WoW-Forever-Datenbank – für Beute, Materialien, Gegner und Bosse.</p></div>`
  };

  // Alle Themen einmal aufbauen – das Menü blendet nur um (die Suche behält so ihren Text)
  $('.tp-tabs').innerHTML = TOPICS.map(t => `<button type="button" role="tab" class="tp-tab" id="tp-tab-${t.id}" aria-controls="tp-sec-${t.id}" data-tab="${t.id}"><img src="${icon(t.icon)}" alt="" loading="lazy">${esc(t.label)}</button>`).join('');
  $('.tp-body').innerHTML = TOPICS.map((t, i) => {
    const next = TOPICS[i + 1];
    return `<section class="tp-sec" id="tp-sec-${t.id}" role="tabpanel" aria-labelledby="tp-tab-${t.id}" hidden>
      ${t.id === 'befehle' ? '' : `<div class="tp-sec-h"><img src="${icon(t.icon)}" alt="" loading="lazy"><h3>${esc(t.label)}</h3></div>`}
      ${t.intro ? `<p class="tp-intro">${esc(t.intro)}</p>` : ''}
      ${t.steps ? `<ul class="tp-steps">${t.steps.map(s => `<li class="tp-step"><img src="${icon(s.icon)}" alt="" loading="lazy"><div><h4>${esc(s.h)}</h4>${s.p.map(p => `<p>${p}</p>`).join('')}</div></li>`).join('')}</ul>` : ''}
      ${(t.extra || []).map(k => EXTRA[k]()).join('')}
      ${next ? `<button type="button" class="tp-next" data-tab="${next.id}">Weiter: ${esc(next.label)}</button>` : ''}
    </section>`;
  }).join('');

  function show(id, { scroll = false } = {}) {
    tab = TOPICS.some(t => t.id === id) ? id : TOPICS[0].id;
    root.querySelectorAll('.tp-tab').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    root.querySelectorAll('.tp-sec').forEach(s => { s.hidden = s.id !== 'tp-sec-' + tab; });
    // „Weiter“ unten auf einem langen Thema: zurück nach oben zum Menü
    if (scroll && $('.tp-tabs').getBoundingClientRect().top < 0) $('.tp-tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderLadder(ladder) {
    $('.tp-ladder').innerHTML = ladder.map((r, i) => `<div><span>${esc(r.name)}</span><span>${i ? 'ab ' + num(r.min) + ' Ruf' : 'zu Beginn'}</span></div>`).join('');
  }

  function renderCmds() {
    const q = $('.tp-search').value.trim().toLowerCase();
    const hits = cmds.filter(c => !q || `${c.cmd} ${c.desc} ${c.group}`.toLowerCase().includes(q));
    const groups = [...new Set(hits.map(c => c.group))];
    $('.tp-cmds').innerHTML = groups.length ? groups.map(g => `<div class="tp-group">${esc(g)}</div><table>${hits.filter(c => c.group === g).map(c => `<tr><td><code>${esc(c.cmd)}</code></td><td>${esc(c.desc)}</td></tr>`).join('')}</table>`).join('')
      : '<p class="tp-note">Kein Befehl gefunden.</p>';
    $('.tp-cmd-note').textContent = live ? 'Genau so, wie die Befehle gerade im Stream eingestellt sind.' : 'Die wichtigsten Befehle – im Stream können sie leicht anders eingestellt sein.';
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (!t) return;
    show(t.dataset.tab, { scroll: t.classList.contains('tp-next') });
    if (history.replaceState) history.replaceState(null, '', '#' + tab); // eigene Adresse je Thema, z.B. …/mitspielen#talente
  });
  // Pfeiltasten im Menü
  $('.tp-tabs').addEventListener('keydown', (e) => {
    const i = TOPICS.findIndex(t => t.id === tab);
    const to = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? i + 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? TOPICS.length - 1 : null;
    if (to === null) return;
    e.preventDefault();
    const next = TOPICS[(to + TOPICS.length) % TOPICS.length].id;
    show(next);
    if (history.replaceState) history.replaceState(null, '', '#' + next);
    $('#tp-tab-' + next).focus();
  });
  const fromHash = () => { try { return decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { return ''; } }; // kaputte Adresse darf nichts stoppen
  window.addEventListener('hashchange', () => show(fromHash()));

  $('.tp-search').addEventListener('input', renderCmds);
  show(fromHash());
  renderLadder(LADDER);
  renderCmds();
  if (!CONFIG.dataUrl) return;
  fetch(CONFIG.dataUrl + (CONFIG.dataUrl.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000)) // der Minuten-Zusatz hält die Daten frisch, der Browser darf sie innerhalb der Minute wiederverwenden
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      if (!d) return;
      // nur, was alle im Chat schreiben können – Befehle für Mods bleiben im Dock
      const all = Array.isArray(d.commands) ? d.commands.filter(c => !c.who || c.who === 'alle') : [];
      if (all.length) { cmds = all; live = true; renderCmds(); }
      if (Array.isArray(d.ladder) && d.ladder.length) renderLadder(d.ladder);
      if (d.repBei) $('.tp-rep-h').textContent = 'Ruf ' + d.repBei;
    })
    .catch(() => { /* Standard-Befehle bleiben stehen */ });
})();
</script>
