<!-- =====================================================================
     Statistiken für trutzstaehler.de (Squarespace, Code-Block)
     Im Stream passieren die Dinge – hier stehen die Zahlen dazu:
     der letzte Stream, der Kanal, die Spiele (Darkspear-Inseln, Quiz,
     Rätsel, Angeln, Münze, Aufbauspiel, Beute des Tages), die Bosse und
     das Glücksrad. Die Daten kommen von der Stream-Zentrale – dieselbe
     Datei wie bei der Charakterseite. Ohne Datei erscheinen Beispieldaten.
     Einfügen: Seite bearbeiten → Block hinzufügen → Code → alles hier
     einfügen („Quelltext anzeigen“ aus).
     Direkt zu einem Reiter: /statistiken#stream, #kanal, #spiele, #bosse,
     #gluecksrad
     ===================================================================== -->

  const COIN = [['kopf', 'Kopf'], ['zahl', 'Zahl'], ['seite', 'Kante']];

  /* ---------- Beispieldaten (nur solange keine Datei eingetragen ist oder sie fehlt) ---------- */
  const SAMPLE = {

    },

        thanks: [{ key: 'follow', name: 'Knackfix', info: '' }, { key: 'sub', name: 'Grimmzahn', info: '3 Monate' }, { key: 'cheer', name: 'Mankrik', info: '500 Bits' }, { key: 'raid', name: 'Magnus_Stahlbart', info: 'mit 23 Zuschauern' }, { key: 'topCheer', name: 'Mankrik', info: '700 Bits' }],

      },
      games: {
        bg: { a: 'Allianz', h: 'Horde', wins: { a: 18, h: 15 },
          history: [{ side: 'h', score: '1.240 : 2.000', at: '2026-10-24T20:40:00Z' }, { side: 'a', score: '2.000 : 1.610', at: '2026-10-24T20:20:00Z' }, { side: 'a', score: '2.000 : 980', at: '2026-10-21T20:35:00Z' }] },
        quiz: { top: [{ name: 'Anna', n: 64 }, { name: 'Sternenwind', n: 41 }, { name: 'Grimmzahn', n: 22 }], winners: [{ name: 'Anna', pts: 7, of: 10, at: '2026-10-24T20:50:00Z' }] },
        riddle: { top: [{ name: 'Sternenwind', n: 19 }, { name: 'Knackfix', n: 12 }], winners: [{ name: 'Sternenwind', pts: 4, of: 6, at: '2026-10-21T20:50:00Z' }] },
        fish: { top: [{ name: 'Grimmzahn', n: 88 }, { name: 'Anna', n: 23 }], winners: [{ name: 'Grimmzahn', pts: 9, of: 21, at: '2026-10-24T20:15:00Z' }] },
        coin: { session: { kopf: 4, zahl: 3, seite: 0 }, lifetime: { kopf: 212, zahl: 205, seite: 2 }, last: [{ side: 'zahl', name: 'Anna' }, { side: 'kopf', name: 'Mankrik' }] },

          { at: '2026-10-21T20:25:00Z', boss: 'Erzmagier Arugal', won: false, players: 8, loot: [] }]
      },
      wheel: { since: '2026-09-01T18:00:00Z', spins: 143, completed: 118, failed: 12, canceled: 4,
        users: [{ name: 'Anna', n: 21 }, { name: 'Community', n: 19 }, { name: 'Grimmzahn', n: 14 }],
        segments: [{ name: 'Beweglichkeit › BEWEGLICHKEIT', n: 37 }, { name: 'Beweglichkeit › KRAFT', n: 29 }],
        sources: [{ name: 'Kanalpunkte', n: 81 }, { name: 'Ziel erreicht', n: 22 }, { name: 'Game Master', n: 17 }] }
    }
  };

  /* ---------- Hilfen ---------- */
  const root = document.getElementById('tsz-stats');
  if (!root) return;
  const $ = (sel) => root.querySelector(sel);
  // Kein Emoji auf der Homepage
  const clean = (s) => String(s ?? '').replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\uFE0F\u200D]/gu, '').replace(/\s{2,}/g, ' ').trim();
  // Texte des Glücksrads in GROSSBUCHSTABEN normal schreiben (keine Großbuchstaben-Schreibweise auf der Homepage)
  const nice = (s) => clean(s).split(' › ').map(p => (/\p{Lu}{3,}/u.test(p) && p === p.toUpperCase()
    ? p.toLowerCase().replace(/(^|[\s(\-/])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()) : p)).join(' › ');
  const esc = (s) => clean(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('de-DE');
  const icon = (name) => `https://wow.zamimg.com/images/wow/icons/large/${encodeURIComponent(name || 'inv_misc_questionmark')}.jpg`;
  const date = (iso) => (iso ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '');
  const time = (iso) => (iso ? new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '');
  const pct = (a, b) => (b > 0 ? Math.round(a / b * 100) : 0);
  function dur(sec) {
    const m = Math.round((sec || 0) / 60);
    if (m < 60) return `${m} Min.`;
    const h = Math.floor(m / 60);
    if (h < 48) return m % 60 ? `${h} Std. ${m % 60} Min.` : `${h} Std.`;
    return `${num(Math.floor(h / 24))} Tage ${h % 24} Std.`;
  }
  const ui = { tab: 'stream' };
  let data = SAMPLE;
  let heroesByName = Object.create(null); // ohne Prototyp – ein Chatter namens „constructor“ darf nichts kaputtmachen

  /** Name → Link zum Charakterfenster, wenn es einen Helden mit diesem Namen gibt */
  function who(name) {
    const key = String(name || '').toLowerCase();
    const h = heroesByName[key];
    if (!h) return `<span class="ts-name">${esc(name)}</span>`;
    return `<a class="ts-name" href="${esc(CONFIG.charPage)}#${encodeURIComponent(h[0])}" style="color:${CLASS_COLORS[h[1].cls] || '#f3eee2'}">${esc(name)}</a>`;
  }

  /* ---------- Bausteine ---------- */
  const sec = (title, body, { ic = '', note = '' } = {}) =>
    `<section class="ts-sec"><h3 class="ts-sec-h">${ic ? `<img src="${icon(ic)}" alt="" loading="lazy">` : ''}${esc(title)}${note ? `<small>${esc(note)}</small>` : ''}</h3>${body}</section>`;
  const tiles = (list) => `<div class="ts-tiles">${list.filter(Boolean).map(([v, l, s]) => `<div class="ts-tile"><b${/^[\d.\s:,%+→-]+$/.test(String(v)) ? '' : ' class="txt"'}>${esc(v)}</b><span>${esc(l)}</span>${s ? `<small>${esc(s)}</small>` : ''}</div>`).join('')}</div>`;
  const plural = (one, many) => (n) => (n === 1 ? one : many);
  const empty = (text) => `<div class="ts-box"><div class="ts-empty">${esc(text)}</div></div>`;

  /** Rangliste: [{ name, n }] mit Platz, Name und Wert */
  function rank(list, unit, emptyText = 'Noch niemand.') {
    const rows = (list || []).slice(0, CONFIG.top);
    if (!rows.length) return empty(emptyText);
    return `<div class="ts-box">${rows.map((x, i) => `<div class="ts-row${i < 3 ? ' p' + (i + 1) : ''}">
      <span class="ts-place">${i + 1}</span>${who(x.name)}<span class="ts-val">${num(x.n)}${unit ? ` <small>${esc(typeof unit === 'function' ? unit(x.n) : unit)}</small>` : ''}</span></div>`).join('')}</div>`;
  }

  function goals(list) {
    return `<div class="ts-box">${list.map(g => {
      const p = Math.max(0, Math.min(100, pct(g.cur, g.target)));
      return `<div class="ts-goal${g.done ? ' done' : ''}"><div class="ts-goal-head"><b>${esc(g.title)}</b><span>${num(g.cur)} / ${num(g.target)}${g.done ? ' · erreicht' : ''}</span></div>
        <div class="ts-bar"><i style="width:${p}%"></i></div></div>`;
    }).join('')}</div>`;
  }

  /** Allianz gegen Horde: unit = [Einzahl, Mehrzahl] */
  function split(aName, a, hName, h, unit) {
    const total = a + h;
    const u = (n) => unit[n === 1 ? 0 : 1];
    const pa = total ? a / total * 100 : 50;
    return `<div class="ts-box ts-split"><div class="ts-split-head">
      <span class="a">${esc(aName)}<small>${num(a)} ${esc(u(a))} · ${total ? Math.round(pa) : 0} %</small></span>
      <span class="h">${esc(hName)}<small>${num(h)} ${esc(u(h))} · ${total ? 100 - Math.round(pa) : 0} %</small></span></div>
      <div class="ts-split-bar"><i class="a" style="width:${pa}%"></i><i class="h" style="width:${100 - pa}%"></i></div></div>`;
  }

  function table(head, rows, emptyText) {
    if (!rows.length) return empty(emptyText);
    return `<div class="ts-box ts-scroll"><table class="ts-table"><thead><tr>${head.map(([t, c]) => `<th${c ? ` class="${c}"` : ''}>${esc(t)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map(([html, c]) => `<td${c ? ` class="${c}"` : ''}>${html}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------- Reiter: Letzter Stream ---------- */
  function renderStream(st) {
    const s = st.session;
    if (!s || (!s.sec && !s.messages && !s.follows && !s.subs)) return empty('Noch kein Stream erfasst – nach dem nächsten Stream stehen hier die Zahlen.');
    const lvl = s.level && s.level.to > s.level.from ? [`${s.level.from} → ${s.level.to}`, 'Stufen von ' + ((st.channel && st.channel.char && st.channel.char.name) || 'Trutz')] : null;
    let out = tiles([
      [s.sec ? dur(s.sec) : '–', 'Dauer', s.from ? `ab ${time(s.from)} Uhr` : ''],
      [num(s.follows), 'Neue Follower'],
      [num(s.subs), 'Neue Abos'],
      [num(s.bits), 'Bits'],
      [num(s.raids), s.raids === 1 ? 'Raid' : 'Raids', s.raidViewers ? `mit ${num(s.raidViewers)} Gästen` : ''],
      [num(s.chatters), 'im Chat dabei', s.messages ? `${num(s.messages)} Nachrichten` : ''],
      s.deaths != null ? [num(s.deaths), s.deaths === 1 ? 'Tod' : 'Tode'] : null,
      lvl
    ]);
    out += `<div class="ts-gap"></div><div class="ts-cols">
      ${sec('Am aktivsten im Chat', rank(s.topChat, plural('Nachricht', 'Nachrichten'), 'Noch keine Nachrichten.'))}
      ${sec('Meister des Rufs', rank(s.topRep, 'Ruf', 'Noch kein Ruf verdient.'))}
    </div>`;
    if ((s.thanks || []).length) {
      out += sec('Danke an', `<div class="ts-box">${s.thanks.map(t => `<div class="ts-row plain"><span>${who(t.name)}<span class="ts-sub">${esc(THANKS[t.key] || '')}</span></span><span class="ts-val">${esc(t.info)}</span></div>`).join('')}</div>`);
    }
    if ((s.goals || []).length) out += sec('Ziele', goals(s.goals));
    if ((s.draws || []).length) {
      out += sec('Glücksrad in diesem Stream', table([['Uhrzeit'], ['Wer'], ['Ergebnis']],
        s.draws.map(d => [[esc(time(d.at)), 'when'], [who(d.name)], [`${esc(nice(d.result))}<span class="ts-sub">${esc(nice(d.wheel))}</span>`]]), ''), { note: `${num(s.draws.length)} ${s.draws.length === 1 ? 'Dreh' : 'Drehs'}` });
    }
    return out;
  }

  /* ---------- Reiter: Kanal ---------- */
  function renderChannel(st) {
    const c = st.channel || {};
    const t = data.totals || {};
    let out = tiles([
      c.followers != null ? [num(c.followers), 'Follower'] : null,
      c.subs != null ? [num(c.subs), 'Abonnenten'] : null,
      t.heroes != null ? [num(t.heroes), 'Helden aus dem Chat'] : null,
      t.bosses != null ? [num(t.bosses), 'Bosse besiegt'] : null,
      t.foes != null ? [num(t.foes), 'Gegner besiegt'] : null,
      ...(c.counters || []).map(x => [num(x.total), `${x.name} gesamt`, `${num(x.session)} im letzten Stream`])
    ]);
    if ((c.goals || []).length) out += sec('Meilensteine', goals(c.goals));
    const ch = c.char;
    if (ch) {
      const p = ch.max ? pct(ch.level, ch.max) : 0;
      out += sec(`Der Held des Streams`, `<div class="ts-box"><div class="ts-hero">
        <div><div class="ts-hero-name">${esc(ch.name)}</div><span class="ts-sub">${esc([`Stufe ${ch.level}`, ch.race, ch.cls].filter(Boolean).join(' '))}</span></div>
        <div class="ts-val">${ch.sec ? dur(ch.sec) : '–'}<small>Spielzeit im Stream</small></div>
        <div class="ts-bar"><i style="width:${p}%"></i></div></div></div>
        ${(ch.levels || []).length ? `<div class="ts-gap"></div>${table([['Stufe'], ['Erreicht am'], ['Dauer auf der Stufe davor', 'num']],
          ch.levels.map(l => [[`Stufe ${num(l.level)}`], [esc(date(l.at)), 'when'], [l.sec ? esc(dur(l.sec)) : '–', 'num']]), '')}` : ''}`);
    }
    if (out === tiles([])) return empty('Noch keine Zahlen vom Kanal.');
    return out;
  }

  /* ---------- Reiter: Spiele ---------- */
  function gameCard(title, ic, g, unit) {
    const w = (g.winners || []).slice(0, 3);
    return sec(title, `${w.length ? `<p class="ts-label">Letzte Rundensieger</p><div class="ts-box">${w.map(x => `<div class="ts-row plain"><span>${who(x.name)}<span class="ts-sub">${esc(date(x.at))}</span></span><span class="ts-val">${num(x.pts)}${x.of ? ` <small>von ${num(x.of)}</small>` : ''}</span></div>`).join('')}</div><div class="ts-gap"></div>` : ''}
      <p class="ts-label">Ewige Bestenliste</p>${rank(g.top, unit, 'Noch niemand.')}`, { ic });
  }

  function renderGames(st) {
    const g = st.games || {};
    let out = '';
    if (g.bg) {
      const b = g.bg;
      out += sec('Schlacht um die Darkspear-Inseln', `${split(b.a, b.wins.a, b.h, b.wins.h, ['Sieg', 'Siege'])}<div class="ts-gap"></div>
        <p class="ts-label">Hallen des Ruhms: die letzten Schlachten der Pause</p>${table([['Datum'], ['Sieger'], ['Punkte', 'num']], (b.history || []).map(x => [[esc(`${date(x.at)} ${time(x.at)}`.trim()) || '–', 'when'],
          [`<span class="side-${x.side === 'a' ? 'a' : 'h'}">${esc(x.side === 'a' ? b.a : b.h)}</span>`], [esc(x.score), 'num']]), 'Noch keine Schlacht geschlagen.')}`, { ic: 'inv_bannerpvp_02' });
    }
    if (g.quiz || g.riddle || g.fish) {
      out += `<div class="ts-gap"></div><div class="ts-cols3">
        ${g.quiz ? gameCard('Azeroth-Quiz', 'inv_misc_book_09', g.quiz, 'richtig') : ''}
        ${g.riddle ? gameCard('Azeroth-Rätsel', 'inv_misc_note_01', g.riddle, 'gelöst') : ''}
        ${g.fish ? gameCard('Angeln', 'trade_fishing', g.fish, plural('Fisch', 'Fische')) : ''}
      </div>`;
    }
    if (g.coin) {
      const L = g.coin.lifetime || {};
      const S = g.coin.session || {};
      const all = COIN.reduce((n, [k]) => n + (L[k] || 0), 0);
      out += sec('Münzwurf', `${tiles(COIN.map(([k, l]) => [num(L[k]), l, `${pct(L[k] || 0, all)} % · ${num(S[k])} im letzten Stream`]))}
        ${(g.coin.last || []).length ? `<p class="ts-note">Zuletzt: ${g.coin.last.map(x => `${esc((COIN.find(c => c[0] === x.side) || [0, x.side])[1])} (${esc(x.name)})`).join(' · ')}</p>` : ''}`, { ic: 'inv_misc_coin_01', note: `${num(all)} Würfe` });
    }
    if (g.build) {
      const b = g.build;
      out += sec('Aufbauspiel', `${tiles([[`Stufe ${num(b.level)}`, 'Ausbau'], [num(b.messages), 'Nachrichten gezählt']])}<div class="ts-gap"></div>
        ${split('Allianz', b.alliance || 0, 'Horde', b.horde || 0, ['Punkt', 'Punkte'])}<div class="ts-gap"></div>
        <div class="ts-cols">${sec('Top Helfer', rank(b.helpers, plural('Nachricht', 'Nachrichten')), { note: 'letzter Stream' })}${sec('Legenden', rank(b.legends, plural('Nachricht', 'Nachrichten')), { note: 'gesamt' })}</div>`, { ic: 'inv_misc_gear_01' });
    }
    if ((g.loot || []).length) {
      out += sec('Beute des Tages', table([['Datum'], ['Gewinner'], ['Preis']], g.loot.map(x => [[esc(x.date), 'when'], [who(x.name)], [esc(x.prize)]]), ''), { ic: 'inv_misc_bag_10' });
    }
    return out || empty('Noch keine Spiele gespielt.');
  }

  /* ---------- Reiter: Bosse ---------- */
  function renderBosses(st) {
    const b = st.bosses;
    if (!b || (!(b.kills || []).length && !(b.history || []).length)) return empty('Noch kein Boss besiegt – die Bosskämpfe laufen in der Pause.');
    const total = (b.kills || []).reduce((n, k) => n + k.n, 0);
    let out = tiles([[num(total), 'Bosse besiegt'], [num((b.kills || []).length), 'verschiedene Bosse']]);
    out += `<div class="ts-gap"></div><div class="ts-cols">`;
    out += sec('Besiegte Bosse', (b.kills || []).length ? `<div class="ts-box">${b.kills.slice(0, 15).map(k => `<div class="ts-row ico"><img class="ts-pic" src="${icon(k.icon)}" alt="" loading="lazy"><span><span class="ts-name">${esc(k.name)}</span><span class="ts-sub">${esc(k.zone)}</span></span><span class="ts-val">${num(k.n)}×</span></div>`).join('')}</div>` : empty('Noch keiner.'));
    out += sec('Letzte Kämpfe', (b.history || []).length ? `<div class="ts-box">${b.history.map(h => `<div class="ts-row plain"><span><span class="ts-name">${esc(h.boss)}</span>
        <span class="ts-sub">${esc(date(h.at))} · ${num(h.players)} Mitstreiter</span>
        ${(h.loot || []).length ? `<span class="ts-loot">${h.loot.map(x => `<span><b class="q-${esc(x.q)}">[${esc(x.name)}]</b> ${esc(x.user)}${x.roll ? ` (${num(x.roll)})` : ''}</span>`).join('')}</span>` : ''}</span>
        <span class="${h.won ? 'won' : 'lost'}">${h.won ? 'Sieg' : 'Niederlage'}</span></div>`).join('')}</div>` : empty('Noch kein Kampf.'));
    return out + '</div>';
  }

  /* ---------- Reiter: Glücksrad ---------- */
  function renderWheel(st) {
    const w = st.wheel;
    if (!w || !w.spins) return empty('Das Glücksrad hat sich noch nicht gedreht.');
    return `${tiles([[num(w.spins), 'Drehs'], [num(w.completed), 'Quests erledigt'], [num(w.failed), 'fehlgeschlagen'], [num(w.canceled), 'unerledigt abgegeben']])}
      <p class="ts-note">Gezählt seit ${esc(date(w.since))}</p><div class="ts-gap"></div>
      <div class="ts-cols3">${sec('Wer am meisten dreht', rank(w.users, plural('Dreh', 'Drehs')))}${sec('Häufigste Ergebnisse', rank((w.segments || []).map(x => ({ name: nice(x.name), n: x.n })), '×'))}${sec('Ausgelöst durch', rank(w.sources, '×'))}</div>`;
  }

  /* ---------- Anzeige ---------- */
  function renderState() {
    const st = data.stream || {};
    const s = st.session || {};
    const box = $('.ts-state');
    box.classList.toggle('live', !!st.live);
    if (st.live) box.innerHTML = `<span class="ts-dot" aria-hidden="true"></span><b>Gerade live</b>${s.from ? ` · seit ${esc(time(s.from))} Uhr` : ''}`;
    else if (s.from || s.since) box.innerHTML = `Letzter Stream: <b>${esc(date(s.from || s.since))}</b>${s.sec ? ` · ${esc(dur(s.sec))}` : ''}`;
    else box.textContent = 'Noch kein Stream erfasst';
  }

  function renderTabs() {
    const live = data.stream && data.stream.live;
    $('.ts-tabs').innerHTML = TABS.map(t => `<button type="button" role="tab" class="ts-tab${t.id === ui.tab ? ' on' : ''}" aria-selected="${t.id === ui.tab}" data-tab="${t.id}"><img src="${icon(t.icon)}" alt="" loading="lazy">${esc(t.id === 'stream' && live ? 'Dieser Stream' : t.label)}</button>`).join('');
  }

  function renderBody() {
    const st = data.stream || {};
    const fn = { stream: renderStream, kanal: renderChannel, spiele: renderGames, bosse: renderBosses, gluecksrad: renderWheel }[ui.tab] || renderStream;
    $('.ts-body').innerHTML = data.stream ? fn(st) : empty('Noch keine Statistiken – sie kommen mit der nächsten Version der Stream-Zentrale.');
  }

  function renderFoot() {
    $('.ts-foot').textContent = `${data.updated ? 'Stand ' + new Date(data.updated).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : ''}${data.sample ? ' · Beispieldaten' : ''} · Während des Streams kommen neue Zahlen etwa alle 30 Minuten, nach dem Stream sofort.`;
  }

  function render() {
    heroesByName = Object.create(null);
    Object.entries(data.characters || {}).forEach(([login, c]) => { if (c && c.name) heroesByName[String(c.name).toLowerCase()] = [login, c]; });
    renderState(); renderTabs(); renderBody(); renderFoot();
  }

  function fromHash() {
    let h = location.hash.replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) { /* kaputte Adresse – so lassen */ }
    if (TABS.some(t => t.id === h)) ui.tab = h;
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tab]');
    if (!t) return;
    ui.tab = t.dataset.tab;
    if (history.replaceState) history.replaceState(null, '', '#' + ui.tab);
    renderTabs(); renderBody();
  });
  window.addEventListener('hashchange', () => { fromHash(); renderTabs(); renderBody(); });

  fromHash();
  render();
  if (!CONFIG.dataUrl) return;
  fetch(CONFIG.dataUrl + (CONFIG.dataUrl.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000)) // der Minuten-Zusatz hält die Daten frisch, der Browser darf sie innerhalb der Minute wiederverwenden
    .then(r => (r.status === 404 ? null : r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
    .then(d => {
      if (d && d.characters) { data = d; render(); } else $('.ts-foot').textContent = 'Noch keine Daten von der Stream-Zentrale. (Bis dahin: Beispieldaten)';
    })
    .catch(() => { $('.ts-foot').textContent = 'Die Statistiken konnten gerade nicht geladen werden – bitte später noch einmal versuchen. (Bis dahin: Beispieldaten)'; });
})();
</script>
